<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitchify - Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{--blue:#0c7bb3;--blue-dk:#095e8a;--char:#0d1b2a;--mid:#4a5568;--white:#fff;--border:#cde4f0;--danger:#ef4444}
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 20% 30%, #f7fbff 0%, #dde6ef 100%);
            min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;
        }
        .card{
            background:var(--white);border-radius:28px;padding:2.5rem;max-width:420px;width:100%;
            box-shadow:0 20px 60px rgba(12,123,179,0.15);
        }
        .brand{text-align:center;margin-bottom:1.5rem}
        .icon{width:64px;height:64px;background:linear-gradient(145deg,var(--blue),var(--blue-dk));border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 0.8rem}
        .icon svg{width:40px;height:40px}
        .name{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:var(--char)}
        .name span{color:var(--blue)}
        .subtitle{font-size:0.85rem;color:var(--mid);margin-top:4px}
        .field{margin-bottom:1rem}
        .field label{display:block;font-weight:600;font-size:0.8rem;color:var(--char);margin-bottom:0.3rem}
        .input-wrap{position:relative}
        .input-wrap input{width:100%;background:#f4f8fc;border:1.5px solid var(--border);border-radius:10px;padding:12px 40px 12px 12px;font-family:'Nunito',sans-serif;font-size:13px;outline:none}
        .input-wrap input:focus{border-color:var(--blue);background:#fff}
        .toggle-pwd{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#999;font-size:16px;padding:5px}
        .toggle-pwd:hover{color:var(--blue)}
        .forgot-row{display:flex;justify-content:flex-end;margin-bottom:0.5rem}
        .forgot-row a{font-size:0.75rem;color:var(--blue);text-decoration:none;font-weight:600;cursor:pointer}
        .forgot-row a:hover{text-decoration:underline}
        .btn{width:100%;background:linear-gradient(135deg,#0c7bb3 0%,#a78fe8 60%,#f2bae8 100%);color:#fff;border:none;border-radius:30px;padding:12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;margin-top:0.5rem}
        .btn:hover{transform:translateY(-2px)}
        .btn:disabled{opacity:0.7}
        .msg{margin-top:1rem;padding:0.8rem;border-radius:10px;font-weight:600;font-size:0.8rem;display:none;text-align:center}
        .msg.ok{background:#d1fae5;color:#065f46;display:block}
        .msg.err{background:#fee2e2;color:#991b1b;display:block}
        .msg.info{background:#dbeafe;color:#1e40af;display:block}
        .links{text-align:center;margin-top:1.2rem;font-size:0.8rem;color:var(--mid)}
        .links a{color:var(--blue);text-decoration:none;font-weight:600}
        .debug-box{margin-top:1rem;padding:0.8rem;background:#fef3c7;border-radius:10px;font-size:0.7rem;color:#92400e;display:none;word-break:break-all}
        .debug-box.show{display:block}
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <div class="icon"><svg viewBox="0 0 300 300" fill="none"><circle cx="90" cy="150" r="35" stroke="white" stroke-width="3" fill="rgba(255,255,255,0.15)"/><line x1="230" y1="100" x2="230" y2="200" stroke="white" stroke-width="3"/></svg></div>
        <div class="name">Stitch<span>ify</span></div>
        <div class="subtitle">Sign in to your account</div>
    </div>
    <form onsubmit="return handleLogin(event)">
        <div class="field">
            <label>Email Address</label>
            <div class="input-wrap">
                <input type="email" id="email" placeholder="you@email.com" required autocomplete="email">
            </div>
        </div>
        <div class="field">
            <label>Password</label>
            <div class="input-wrap">
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                <button type="button" class="toggle-pwd" onclick="togglePassword()" title="Show password">
                    <i class="fas fa-eye" id="toggleIcon"></i>
                </button>
            </div>
        </div>
        <div class="forgot-row">
            <a onclick="forgotPassword()">Forgot your password?</a>
        </div>
        <button type="submit" class="btn" id="btn">Sign In</button>
        <div class="msg" id="msg"></div>
        <div class="debug-box" id="debugBox"></div>
    </form>
    <div class="links">
        <p>Don't have an account? <a href="/stitchify_auth/register.html">Create one</a></p>
        <p><a href="/">← Back to Home</a></p>
    </div>
</div>

<!-- FORGOT PASSWORD MODAL -->
<div id="forgotModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:20px;">
    <div style="background:white;border-radius:20px;padding:2rem;max-width:400px;width:100%;text-align:center;">
        <h3 style="margin-bottom:1rem;font-family:'Playfair Display',serif;color:var(--char)">Reset Password</h3>
        <p style="font-size:0.85rem;color:var(--mid);margin-bottom:1rem">Enter your email address and we'll send you a link to reset your password.</p>
        <div class="field">
            <label>Email Address</label>
            <input type="email" id="resetEmail" placeholder="you@email.com" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-family:'Nunito',sans-serif;font-size:13px;">
        </div>
        <div id="resetMsg" style="margin:0.8rem 0;font-size:0.8rem;font-weight:600;display:none;"></div>
        <div style="display:flex;gap:10px;margin-top:1rem;">
            <button onclick="closeForgotModal()" style="flex:1;padding:10px;border:1.5px solid var(--border);border-radius:30px;background:white;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:600;">Cancel</button>
            <button onclick="sendResetEmail()" style="flex:1;padding:10px;background:var(--blue);color:white;border:none;border-radius:30px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:600;">Send Reset Link</button>
        </div>
    </div>
</div>

<script>
let showPassword = false;

function togglePassword(){
    showPassword = !showPassword;
    const pwd = document.getElementById('password');
    const icon = document.getElementById('toggleIcon');
    pwd.type = showPassword ? 'text' : 'password';
    icon.className = showPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
}

function forgotPassword(){
    document.getElementById('forgotModal').style.display = 'flex';
    document.getElementById('resetEmail').value = document.getElementById('email').value;
}

function closeForgotModal(){
    document.getElementById('forgotModal').style.display = 'none';
}

function sendResetEmail(){
    const email = document.getElementById('resetEmail').value.trim();
    const msg = document.getElementById('resetMsg');
    const btn = event.target;

    if(!email){
        msg.textContent = 'Please enter your email';
        msg.style.color = '#ef4444';
        msg.style.display = 'block';
        return;
    }

    // Disable button to prevent double-click
    btn.disabled = true;
    btn.textContent = 'Sending...';
    msg.textContent = '⏳ Sending reset link...';
    msg.style.color = '#1e40af';
    msg.style.display = 'block';

    fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email})
    })
    .then(r => r.json())
    .then(data => {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';

        // Always show the same message for security
        msg.textContent = '✅ If that email exists, a reset link has been sent! Check your inbox. Link expires in 3 minutes.';
        msg.style.color = '#16a34a';
        msg.style.display = 'block';

        setTimeout(closeForgotModal, 5000);
    })
    .catch(err => {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
        msg.textContent = '❌ Server error. Is Flask running?';
        msg.style.color = '#ef4444';
        msg.style.display = 'block';
    });
}
// Close forgot modal on overlay click
document.getElementById('forgotModal').addEventListener('click',function(e){
    if(e.target===this)closeForgotModal();
});

async function handleLogin(e){
    e.preventDefault();
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value;
    const btn=document.getElementById('btn');
    const msg=document.getElementById('msg');
    const debugBox=document.getElementById('debugBox');
    
    msg.style.display='none';msg.className='msg';
    debugBox.classList.remove('show');
    
    if(!email||!password){msg.textContent='Please fill all fields';msg.className='msg err';return}
    
    btn.disabled=true;btn.textContent='Signing in...';
    
    // Show debug info
    debugBox.innerHTML='<strong>Debug:</strong><br>Email: '+email+'<br>Password length: '+password.length+' chars<br>Sending request...';
    debugBox.classList.add('show');
    
    try{
        const res=await fetch('/api/auth/login',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({email,password})
        });
        const data=await res.json();
        
        debugBox.innerHTML+='<br>Status: '+res.status+'<br>Response: '+JSON.stringify(data);
        
        if(res.ok&&data.user){
            localStorage.setItem('token',data.token);
            localStorage.setItem('user',JSON.stringify(data.user));
            msg.textContent='✅ Login successful! Redirecting as '+data.user.role+'...';
            msg.className='msg ok';
            setTimeout(()=>{
                window.location.href=data.user.role==='admin'?'/admin':data.user.role==='tailor'?'/tailor':'/customer';
            },1000);
        }else{
            msg.textContent='❌ '+(data.error||'Invalid credentials');
            msg.className='msg err';
            btn.disabled=false;btn.textContent='Sign In';
            
            // Show helpful debug
            if(data.error==='Invalid credentials'){
                debugBox.innerHTML+='<br><br><strong>Possible fixes:</strong><br>1. Check if user exists in MongoDB<br>2. Reset password using MongoDB<br>3. Try registering again';
            }
        }
    }catch(err){
        msg.textContent='❌ Cannot connect to server. Is Flask running on port 5001?';
        msg.className='msg err';
        btn.disabled=false;btn.textContent='Sign In';
        debugBox.innerHTML+='<br><strong>Error:</strong> '+err.message;
    }
}
</script>
</body>
</html>
