<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stitchify – Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<style>
:root{
  --primary:#0c7bb3; --primary-dark:#095f8a; --primary-soft:#e8f4fb;
  --accent:#a75c9a; --accent-light:#f3e8fb;
  --gradient:linear-gradient(135deg,#0c7bb3 0%,#a75c9a 100%);
  --white:#fff; --bg:#f4f6fa; --border:#e0e7ef;
  --text:#1a2340; --text-mid:#4a5568; --text-light:#9aaac4;
  --danger:#ef4444; --success:#16a34a;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'DM Sans',sans-serif;
  --radius:14px; --radius-lg:24px;
  --shadow-lg:0 14px 44px rgba(12,123,179,.18);
  --tr:all 0.22s cubic-bezier(0.4,0,0.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:var(--font-body);min-height:100vh;
  display:flex;align-items:flex-start;justify-content:center;
  background:var(--bg);padding:32px 16px;
  background-image:radial-gradient(circle at 10% 10%, rgba(12,123,179,.05) 0%, transparent 40%),
                   radial-gradient(circle at 90% 90%, rgba(167,92,154,.04) 0%, transparent 40%);
}
.card{
  background:var(--white);border-radius:var(--radius-lg);
  width:100%;max-width:520px;
  box-shadow:var(--shadow-lg);overflow:hidden;
  animation:cardIn .4s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:none;}}

.card-header{
  background:var(--gradient);padding:28px 32px;text-align:center;
  position:relative;overflow:hidden;
}
.card-header::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.08);}
.card-header::after{content:'';position:absolute;bottom:-20px;left:-10px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.05);}
.brand-name{font-family:var(--font-display);font-size:32px;font-weight:900;color:#fff;letter-spacing:2px;position:relative;z-index:1;}
.brand-sub{font-size:12px;color:rgba(255,255,255,.8);letter-spacing:2px;text-transform:uppercase;margin-top:4px;position:relative;z-index:1;}

.card-body{padding:28px 32px 20px;}

/* ── ROLE TABS ── */
.role-tabs{display:flex;gap:8px;background:var(--bg);border-radius:40px;padding:5px;margin-bottom:24px;}
.role-tab{
  flex:1;padding:9px;border-radius:40px;border:none;background:none;
  font-family:var(--font-body);font-size:13px;font-weight:600;
  color:var(--text-light);cursor:pointer;transition:var(--tr);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.role-tab.active{background:var(--white);color:var(--primary);box-shadow:0 2px 8px rgba(12,123,179,.12);}
.role-tab:hover:not(.active){color:var(--primary);}

/* ── FORM ── */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--text-mid);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.input-wrap{position:relative;}
.input-wrap input,.input-wrap select{
  width:100%;padding:11px 14px 11px 40px;
  border:1.5px solid var(--border);border-radius:var(--radius);
  font-family:var(--font-body);font-size:13px;color:var(--text);
  background:var(--bg);transition:var(--tr);
}
.input-wrap select{padding-left:40px;appearance:none;-webkit-appearance:none;}
.input-wrap input:focus,.input-wrap select:focus{outline:none;border-color:var(--primary);background:var(--white);box-shadow:0 0 0 3px rgba(12,123,179,.08);}
.input-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-light);font-size:13px;pointer-events:none;}
.input-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-light);cursor:pointer;font-size:13px;transition:var(--tr);padding:4px;}
.input-toggle:hover{color:var(--primary);}

/* ── TAILOR EXTRA ── */
.tailor-section{
  display:none;border-top:1.5px solid var(--border);
  padding-top:18px;margin-top:4px;margin-bottom:14px;
}
.tailor-section.visible{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-light);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── PASSWORD STRENGTH ── */
.pwd-strength{margin-top:6px;height:3px;border-radius:3px;background:var(--border);overflow:hidden;}
.pwd-bar{height:100%;border-radius:3px;width:0;transition:width .3s,background .3s;}
.pwd-hint{font-size:11px;color:var(--text-light);margin-top:4px;}

/* ── SUBMIT ── */
.btn-register{
  width:100%;padding:13px;border:none;border-radius:var(--radius);
  background:var(--gradient);color:#fff;
  font-family:var(--font-body);font-size:15px;font-weight:700;
  cursor:pointer;transition:var(--tr);margin-top:6px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-register:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(12,123,179,.35);}
.btn-register:disabled{opacity:.7;cursor:not-allowed;transform:none;box-shadow:none;}
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── MSG ── */
.msg{margin-top:14px;padding:11px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;display:none;align-items:center;gap:8px;}
.msg.ok{background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0;display:flex;}
.msg.err{background:#fef2f2;color:var(--danger);border:1px solid #fecaca;display:flex;}

/* ── FOOTER ── */
.card-footer{padding:16px 32px 24px;text-align:center;border-top:1px solid var(--border);}
.card-footer p{font-size:13px;color:var(--text-light);margin-bottom:4px;}
.card-footer a{color:var(--primary);font-weight:600;text-decoration:none;}
.card-footer a:hover{text-decoration:underline;}

/* ── SPECIALIZATION DROPDOWN ── */
.spec-dropdown{position:relative;}
.spec-trigger{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius);
  background:var(--bg);font-family:var(--font-body);font-size:13px;color:var(--text-mid);
  cursor:pointer;transition:var(--tr);text-align:left;
}
.spec-trigger:focus,.spec-trigger.open{outline:none;border-color:var(--primary);background:var(--white);box-shadow:0 0 0 3px rgba(12,123,179,.08);}
.spec-trigger span{flex:1;}
.spec-chevron{margin-left:auto;font-size:11px;transition:transform .22s;color:var(--text-light);}
.spec-chevron.open{transform:rotate(180deg);}
.spec-menu{
  display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:200;
  background:var(--white);border:1.5px solid var(--primary);border-radius:var(--radius);
  box-shadow:0 8px 28px rgba(12,123,179,.14);overflow:hidden;
}
.spec-menu.open{display:block;animation:fadeIn .18s ease;}
.spec-search-wrap{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);}
.spec-search{border:none;outline:none;font-family:var(--font-body);font-size:13px;width:100%;background:transparent;color:var(--text);}
.spec-options{max-height:210px;overflow-y:auto;padding:6px 0;}
.spec-options::-webkit-scrollbar{width:4px;}
.spec-options::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.spec-opt{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;transition:background .15s;font-size:13px;color:var(--text-mid);}
.spec-opt:hover{background:var(--primary-soft);}
.spec-opt.selected{background:var(--primary-soft);color:var(--primary);font-weight:600;}
.spec-opt-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--tr);font-size:10px;}
.spec-opt.selected .spec-opt-check{background:var(--primary);border-color:var(--primary);color:#fff;}
.spec-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.spec-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--primary-soft);border:1px solid rgba(12,123,179,.2);border-radius:20px;font-size:12px;font-weight:600;color:var(--primary);}
.spec-chip button{background:none;border:none;cursor:pointer;color:var(--primary);font-size:13px;padding:0;line-height:1;display:flex;align-items:center;}
.spec-chip button:hover{color:var(--danger);}
@media(max-width:480px){.form-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="brand-name">Stitchify</div>
    <div class="brand-sub">Create Your Account</div>
  </div>

  <div class="card-body">
    <!-- Role tabs -->
    <div class="role-tabs">
      <button class="role-tab active" id="tab-customer" onclick="setRole('customer')">
        <i class="fas fa-user"></i> Customer
      </button>
      <button class="role-tab" id="tab-tailor" onclick="setRole('tailor')">
        <i class="fas fa-cut"></i> Tailor
      </button>
    </div>
    <input type="hidden" id="role" value="customer"/>

    <form id="regForm" onsubmit="handleRegister(event)">

      <!-- Basic fields -->
      <div class="form-group">
        <label>Full Name</label>
        <div class="input-wrap">
          <i class="fas fa-user input-icon"></i>
          <input type="text" id="name" placeholder="Your full name" required/>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <div class="input-wrap">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" placeholder="you@email.com" required/>
          </div>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <div class="input-wrap">
            <i class="fas fa-phone input-icon"></i>
            <input type="tel" id="phone" placeholder="+91 98765 43210"/>
          </div>
        </div>
      </div>

      <!-- Tailor-only fields -->
      <div class="tailor-section" id="tailorSection">
        <div class="section-label">Shop Details</div>
        <div class="form-group">
          <label>Shop / Boutique Name</label>
          <div class="input-wrap">
            <i class="fas fa-store input-icon"></i>
            <input type="text" id="shopName" placeholder="Your boutique name"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Location</label>
            <div class="input-wrap">
              <i class="fas fa-map-marker-alt input-icon"></i>
              <input type="text" id="location" placeholder="City, State"/>
            </div>
          </div>
          <div class="form-group">
            <label>Experience (years)</label>
            <div class="input-wrap">
              <i class="fas fa-briefcase input-icon"></i>
              <input type="number" id="experience" placeholder="e.g., 5" min="0" max="50"/>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>Specializations <span style="color:var(--text-light);font-weight:400;text-transform:none;letter-spacing:0;">(pick all that apply)</span></label>
          <!-- hidden input carries the final value to the submit handler -->
          <input type="hidden" id="specializations"/>
          <div class="spec-dropdown" id="specDropdown">
            <button type="button" class="spec-trigger" id="specTrigger" onclick="toggleSpecDropdown()">
              <i class="fas fa-tags" style="color:var(--text-light);font-size:13px;"></i>
              <span id="specTriggerText">Select specializations…</span>
              <i class="fas fa-chevron-down spec-chevron" id="specChevron"></i>
            </button>
            <div class="spec-menu" id="specMenu">
              <div class="spec-search-wrap">
                <i class="fas fa-search" style="color:var(--text-light);font-size:12px;"></i>
                <input type="text" class="spec-search" placeholder="Search…" oninput="filterSpecs(this.value)" onclick="event.stopPropagation()"/>
              </div>
              <div class="spec-options" id="specOptions"></div>
            </div>
          </div>
          <div class="spec-chips" id="specChips"></div>
        </div>
      </div>

      <!-- Passwords -->
      <div class="form-row">
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="Min. 6 characters" minlength="6" required oninput="checkStrength(this.value)"/>
            <button type="button" class="input-toggle" onclick="togglePwd('password','pwdIcon')">
              <i class="fas fa-eye" id="pwdIcon"></i>
            </button>
          </div>
          <div class="pwd-strength"><div class="pwd-bar" id="pwdBar"></div></div>
          <div class="pwd-hint" id="pwdHint">Enter password</div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="confirmPassword" placeholder="Re-enter password" required/>
            <button type="button" class="input-toggle" onclick="togglePwd('confirmPassword','cpwdIcon')">
              <i class="fas fa-eye" id="cpwdIcon"></i>
            </button>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-register" id="regBtn">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
      <div class="msg" id="regMsg"></div>
    </form>
  </div>

  <div class="card-footer">
    <p>Already have an account? <a href="/login-page">Sign In</a></p>
    <p><a href="/">← Back to Home</a></p>
  </div>
</div>

<script>
// ── 1. HELPERS — defined first so everything below can use them ──

function showMsg(type, text) {
  var el   = document.getElementById('regMsg');
  var icon = type === 'ok' ? 'fa-check-circle' : 'fa-exclamation-circle';
  el.innerHTML    = '<i class="fas ' + icon + '"></i> ' + text;
  el.className    = 'msg ' + type;
  el.style.display = 'flex'; // override the inline none set at top of handleRegister
}

// ── 2. SPECIALIZATION DROPDOWN DATA & STATE ──────────────────

const SPEC_OPTIONS = [
  { group:'Women\'s Wear',  items:['Bridal Lehenga','Saree Blouse','Anarkali Suit','Salwar Kameez','Sharara','Gharara','Kurti','Saree Draping','Choli'] },
  { group:'Men\'s Wear',    items:['Sherwani','Kurta Pyjama','Jodhpuri Suit','Nehru Jacket','Bandhgala','Indo-Western Suit','Achkan'] },
  { group:'Bridal',         items:['Bridal Couture','Groom Wear','Wedding Lehenga','Engagement Outfits','Reception Dress'] },
  { group:'Western Fusion', items:['Indo-Western','Cape Blouse','Jacket Lehenga','Fusion Wear','Designer Gown'] },
  { group:'Embroidery',     items:['Zardozi Work','Aari Embroidery','Kantha Work','Mirror Work','Phulkari','Hand Embroidery','Machine Embroidery'] },
  { group:'Fabrics',        items:['Silk Sarees','Kanjivaram','Banarasi','Chanderi','Cotton Suits','Linen Wear'] },
  { group:'Alterations',    items:['Blouse Alterations','Dress Alterations','Resizing','Repair Work','Custom Stitching'] },
];

let selectedSpecs = [];
let specMenuOpen   = false;

function buildSpecOptions(filter) {
  filter = filter || '';
  const container = document.getElementById('specOptions');
  const fl = filter.toLowerCase();
  let html = '';
  SPEC_OPTIONS.forEach(function(group) {
    const matches = group.items.filter(function(i) { return !fl || i.toLowerCase().includes(fl); });
    if (!matches.length) return;
    html += '<div style="padding:6px 14px 2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-light);">' + group.group + '</div>';
    matches.forEach(function(item) {
      const sel = selectedSpecs.indexOf(item) !== -1;
      const safeItem = item.replace(/'/g, "\\'");
      html += '<div class="spec-opt ' + (sel ? 'selected' : '') + '" onclick="toggleSpec(\'' + safeItem + '\')">'
            + '<div class="spec-opt-check">' + (sel ? '<i class="fas fa-check"></i>' : '') + '</div>'
            + '<span>' + item + '</span>'
            + '</div>';
    });
  });
  container.innerHTML = html || '<div style="padding:16px;text-align:center;color:var(--text-light);font-size:13px;">No matches</div>';
}

function toggleSpecDropdown() {
  specMenuOpen = !specMenuOpen;
  document.getElementById('specMenu').classList.toggle('open', specMenuOpen);
  document.getElementById('specTrigger').classList.toggle('open', specMenuOpen);
  document.getElementById('specChevron').classList.toggle('open', specMenuOpen);
  if (specMenuOpen) {
    buildSpecOptions('');
    var s = document.querySelector('.spec-search');
    if (s) s.focus();
  }
}

function filterSpecs(val) { buildSpecOptions(val); }

function toggleSpec(item) {
  var idx = selectedSpecs.indexOf(item);
  if (idx === -1) selectedSpecs.push(item);
  else selectedSpecs.splice(idx, 1);
  updateSpecUI();
  var s = document.querySelector('.spec-search');
  buildSpecOptions(s ? s.value : '');
}

function removeSpec(item) {
  selectedSpecs = selectedSpecs.filter(function(s) { return s !== item; });
  updateSpecUI();
  if (specMenuOpen) {
    var s = document.querySelector('.spec-search');
    buildSpecOptions(s ? s.value : '');
  }
}

function updateSpecUI() {
  document.getElementById('specializations').value = selectedSpecs.join(',');
  document.getElementById('specTriggerText').textContent =
    selectedSpecs.length ? selectedSpecs.length + ' selected' : 'Select specializations…';
  document.getElementById('specChips').innerHTML = selectedSpecs.map(function(s) {
    var safe = s.replace(/'/g, "\\'");
    return '<div class="spec-chip">' + s
      + '<button type="button" onclick="removeSpec(\'' + safe + '\')">'
      + '<i class="fas fa-times"></i></button></div>';
  }).join('');
}

// Close dropdown on outside click
document.addEventListener('click', function(e) {
  var dd = document.getElementById('specDropdown');
  if (specMenuOpen && dd && !dd.contains(e.target)) {
    specMenuOpen = false;
    document.getElementById('specMenu').classList.remove('open');
    document.getElementById('specTrigger').classList.remove('open');
    document.getElementById('specChevron').classList.remove('open');
  }
});

// ── 3. ROLE SWITCH ───────────────────────────────────────────

function setRole(role) {
  document.getElementById('role').value = role;
  document.getElementById('tab-customer').classList.toggle('active', role === 'customer');
  document.getElementById('tab-tailor').classList.toggle('active', role === 'tailor');
  document.getElementById('tailorSection').classList.toggle('visible', role === 'tailor');
  var shopName = document.getElementById('shopName');
  var loc      = document.getElementById('location');
  if (role === 'tailor') { shopName.required = true; loc.required = true; }
  else { shopName.required = false; loc.required = false; }
}

// ── 5. URL PARAM + PASSWORD TOGGLE + STRENGTH ───────────────

// URL param — auto-switch to tailor tab if ?role=tailor
(function() {
  var rp = new URLSearchParams(window.location.search);
  if (rp.get('role') === 'tailor') setRole('tailor');
})();

// Toggle password visibility
var pwdStates = {};
function togglePwd(fieldId, iconId) {
  pwdStates[fieldId] = !pwdStates[fieldId];
  document.getElementById(fieldId).type = pwdStates[fieldId] ? 'text' : 'password';
  document.getElementById(iconId).className = pwdStates[fieldId] ? 'fas fa-eye-slash' : 'fas fa-eye';
}

// Password strength indicator
function checkStrength(val) {
  var bar  = document.getElementById('pwdBar');
  var hint = document.getElementById('pwdHint');
  if (!val) { bar.style.width = '0'; hint.textContent = 'Enter password'; bar.style.background = ''; return; }
  var score = 0;
  if (val.length >= 6)           score++;
  if (val.length >= 10)          score++;
  if (/[A-Z]/.test(val))         score++;
  if (/[0-9]/.test(val))         score++;
  if (/[^a-zA-Z0-9]/.test(val)) score++;
  var levels = [
    ['20%','#ef4444','Weak'],
    ['40%','#f97316','Fair'],
    ['60%','#f59e0b','Good'],
    ['80%','#22c55e','Strong'],
    ['100%','#16a34a','Very strong']
  ];
  var lvl = levels[Math.min(score - 1, 4)] || ['10%','#ef4444','Too short'];
  bar.style.width = lvl[0]; bar.style.background = lvl[1];
  hint.textContent = lvl[2]; hint.style.color = lvl[1];
}

// ── 4. REGISTER HANDLER ──────────────────────────────────────

async function handleRegister(e) {
  e.preventDefault();
  var btn  = document.getElementById('regBtn');
  var msg  = document.getElementById('regMsg');
  msg.className    = 'msg';
  msg.style.display = 'none'; // hidden until showMsg() explicitly sets it to flex
  msg.innerHTML    = '';

  var name    = document.getElementById('name').value.trim();
  var email   = document.getElementById('email').value.trim();
  var phone   = document.getElementById('phone').value.trim();
  var role    = document.getElementById('role').value;
  var pwd     = document.getElementById('password').value;
  var confirm = document.getElementById('confirmPassword').value;

  // Client-side validation
  if (!name)           { showMsg('err', 'Full name is required.'); return; }
  if (!email)          { showMsg('err', 'Email is required.'); return; }
  if (!pwd)            { showMsg('err', 'Password is required.'); return; }
  if (pwd !== confirm) { showMsg('err', 'Passwords do not match!'); return; }
  if (pwd.length < 6)  { showMsg('err', 'Password must be at least 6 characters.'); return; }

  // Build request body — exactly matching what Flask expects
  var body = {
    name:     name,
    email:    email,
    phone:    phone,
    role:     role,
    password: pwd
  };

  if (role === 'tailor') {
    var shopName = document.getElementById('shopName').value.trim();
    var location = document.getElementById('location').value.trim();
    var exp      = parseInt(document.getElementById('experience').value) || 0;
    var specs    = selectedSpecs.length > 0 ? selectedSpecs : [];

    if (!shopName) { showMsg('err', 'Shop name is required for tailors.'); return; }
    if (!location) { showMsg('err', 'Location is required for tailors.'); return; }

    body.shop_name       = shopName;
    body.location        = location;
    body.experience      = exp;
    body.specializations = specs;
  }

  // Log exactly what we're sending so you can debug mismatches
  console.log('📤 Sending register body:', JSON.stringify(body, null, 2));

  btn.disabled  = true;
  btn.innerHTML = '<span class="spinner"></span> Creating Account…';

  try {
    var res  = await fetch('/api/auth/register', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(body)
    });
    var data = await res.json();

    // Always log the server response for debugging
    console.log('📥 Server response:', res.status, data);

    if (res.ok && data.user) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      showMsg('ok', '✅ Account created! Redirecting…');
      setTimeout(function() {
        window.location.href = data.user.role === 'tailor' ? '/tailor' : '/customer';
      }, 1200);
    } else {
      // Show the EXACT error from the server
      var errText = data.error || data.message || ('Server returned ' + res.status);
      showMsg('err', errText);
      btn.disabled  = false;
      btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
    }
  } catch(err) {
    console.error('❌ Fetch error:', err);
    showMsg('err', 'Cannot reach server. Is Flask running on port 5002?');
    btn.disabled  = false;
    btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
  }
}

</script>
</body>
</html>
