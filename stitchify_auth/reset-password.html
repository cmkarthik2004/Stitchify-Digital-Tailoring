<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitchify - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root{--blue:#0c7bb3;--blue-dk:#095e8a;--char:#0d1b2a;--mid:#4a5568;--white:#fff;--border:#cde4f0}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 20% 30%,#f7fbff 0%,#dde6ef 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
        .card{background:var(--white);border-radius:28px;padding:2.5rem;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(12,123,179,0.15)}
        .brand{text-align:center;margin-bottom:1.5rem}
        .icon{width:64px;height:64px;background:linear-gradient(145deg,var(--blue),var(--blue-dk));border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 0.8rem}
        .name{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:var(--char)}
        .name span{color:var(--blue)}
        .subtitle{font-size:0.85rem;color:var(--mid);margin-top:4px}
        .field{margin-bottom:1rem}
        .field label{display:block;font-weight:600;font-size:0.8rem;color:var(--char);margin-bottom:0.3rem}
        .input-wrap{position:relative}
        .input-wrap input{width:100%;background:#f4f8fc;border:1.5px solid var(--border);border-radius:10px;padding:12px 40px 12px 12px;font-family:'Nunito',sans-serif;font-size:13px;outline:none}
        .input-wrap input:focus{border-color:var(--blue);background:#fff}
        .toggle-pwd{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#999;font-size:16px;padding:5px}
        .btn{width:100%;background:linear-gradient(135deg,#0c7bb3 0%,#a78fe8 60%,#f2bae8 100%);color:#fff;border:none;border-radius:30px;padding:12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;margin-top:0.5rem}
        .btn:hover{transform:translateY(-2px)}
        .btn:disabled{opacity:0.7;cursor:not-allowed;transform:none}
        .msg{margin-top:1rem;padding:0.8rem;border-radius:10px;font-weight:600;font-size:0.8rem;display:none;text-align:center}
        .msg.ok{background:#d1fae5;color:#065f46;display:block}
        .msg.err{background:#fee2e2;color:#991b1b;display:block}
        .msg.info{background:#dbeafe;color:#1e40af;display:block}
        .timer{text-align:center;margin-top:0.5rem;font-size:0.8rem;color:var(--mid)}
        .timer span{font-weight:700;color:var(--blue)}
        .timer.expired span{color:#ef4444}
        .links{text-align:center;margin-top:1.2rem;font-size:0.8rem;color:var(--mid)}
        .links a{color:var(--blue);text-decoration:none;font-weight:600}
        .strength-bar{height:4px;border-radius:2px;margin-top:4px;background:#e2e8f0;overflow:hidden}
        .strength-fill{height:100%;border-radius:2px;transition:width 0.3s,background 0.3s;width:0}
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <div class="icon">
            <svg viewBox="0 0 64 64" width="40" height="40" fill="none">
                <circle cx="20" cy="32" r="10" stroke="white" stroke-width="3" fill="rgba(255,255,255,0.15)"/>
                <line x1="55" y1="20" x2="55" y2="44" stroke="white" stroke-width="3"/>
                <line x1="30" y1="32" x2="55" y2="32" stroke="white" stroke-width="2" stroke-dasharray="4 3"/>
            </svg>
        </div>
        <div class="name">Stitch<span>ify</span></div>
        <div class="subtitle" id="pageSubtitle">Set your new password</div>
    </div>

    <div id="expiredBox" style="display:none;text-align:center;padding:1rem;">
        <div style="font-size:2rem;margin-bottom:0.5rem">⏰</div>
        <p style="font-weight:700;color:#ef4444;margin-bottom:0.5rem">Link Expired!</p>
        <p style="font-size:0.8rem;color:var(--mid);margin-bottom:1rem">This reset link is only valid for 3 minutes. Please request a new one.</p>
        <a href="/" style="display:inline-block;padding:10px 24px;background:var(--blue);color:white;border-radius:30px;text-decoration:none;font-family:'Nunito',sans-serif;font-weight:700;font-size:0.85rem;">Back to Login</a>
    </div>

    <div id="resetForm">
        <div id="timerBox" class="timer" style="margin-bottom:1rem;padding:8px;background:#dbeafe;border-radius:8px;">
            ⏱ Link expires in: <span id="timerDisplay">3:00</span>
        </div>

        <div class="field">
            <label>New Password</label>
            <div class="input-wrap">
                <input type="password" id="newPassword" placeholder="Min. 6 characters" oninput="checkStrength(this.value)">
                <button type="button" class="toggle-pwd" onclick="togglePwd('newPassword','icon1')">
                    <i class="fas fa-eye" id="icon1"></i>
                </button>
            </div>
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <div style="font-size:0.7rem;color:var(--mid);margin-top:2px" id="strengthLabel"></div>
        </div>
        <div class="field">
            <label>Confirm Password</label>
            <div class="input-wrap">
                <input type="password" id="confirmPassword" placeholder="Repeat new password">
                <button type="button" class="toggle-pwd" onclick="togglePwd('confirmPassword','icon2')">
                    <i class="fas fa-eye" id="icon2"></i>
                </button>
            </div>
        </div>
        <button class="btn" id="resetBtn" onclick="handleReset()">Reset Password</button>
        <div class="msg" id="msg"></div>
    </div>

    <div class="links"><a href="/">← Back to Login</a></div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script>
// ── Parse URL params ──────────────────────────────────────────
const params  = new URLSearchParams(window.location.search);
const TOKEN   = params.get('token') || '';
const EMAIL   = params.get('email') || '';

// ── Countdown timer (3 min = 180 s) ──────────────────────────
let secondsLeft = 180;
let timerInterval = null;

function startTimer() {
    updateTimerDisplay();
    timerInterval = setInterval(() => {
        secondsLeft--;
        updateTimerDisplay();
        if (secondsLeft <= 0) {
            clearInterval(timerInterval);
            showExpired();
        }
    }, 1000);
}

function updateTimerDisplay() {
    const m = Math.floor(secondsLeft / 60);
    const s = secondsLeft % 60;
    const display = `${m}:${s.toString().padStart(2,'0')}`;
    document.getElementById('timerDisplay').textContent = display;

    const box = document.getElementById('timerBox');
    if (secondsLeft <= 30) {
        box.style.background = '#fee2e2';
        document.getElementById('timerDisplay').style.color = '#ef4444';
    }
}

function showExpired() {
    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('expiredBox').style.display  = 'block';
}

// ── Password strength ─────────────────────────────────────────
function checkStrength(val) {
    const fill  = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    let score = 0;
    if (val.length >= 6)  score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const levels = [
        {w:'0%',  c:'#e2e8f0', t:''},
        {w:'25%', c:'#ef4444', t:'Weak'},
        {w:'50%', c:'#f97316', t:'Fair'},
        {w:'75%', c:'#eab308', t:'Good'},
        {w:'90%', c:'#22c55e', t:'Strong'},
        {w:'100%',c:'#16a34a', t:'Very strong'},
    ];
    const l = levels[Math.min(score, 5)];
    fill.style.width      = l.w;
    fill.style.background = l.c;
    label.textContent     = l.t;
    label.style.color     = l.c;
}

// ── Toggle password visibility ────────────────────────────────
function togglePwd(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon  = document.getElementById(iconId);
    input.type  = input.type === 'password' ? 'text' : 'password';
    icon.className = input.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}

// ── Submit reset ──────────────────────────────────────────────
async function handleReset() {
    const newPassword     = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('resetBtn');
    const msg = document.getElementById('msg');

    msg.style.display = 'none';
    msg.className = 'msg';

    if (!TOKEN || !EMAIL) {
        msg.textContent = '❌ Invalid reset link. Please request a new one.';
        msg.className = 'msg err';
        return;
    }
    if (newPassword.length < 6) {
        msg.textContent = '❌ Password must be at least 6 characters.';
        msg.className = 'msg err';
        return;
    }
    if (newPassword !== confirmPassword) {
        msg.textContent = '❌ Passwords do not match.';
        msg.className = 'msg err';
        return;
    }
    if (secondsLeft <= 0) {
        showExpired();
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {
        const res  = await fetch('/api/auth/reset-password', {
            method:  'POST',
            headers: {'Content-Type': 'application/json'},
            body:    JSON.stringify({token: TOKEN, email: EMAIL, new_password: newPassword})
        });
        const data = await res.json();

        if (res.ok) {
            clearInterval(timerInterval);
            document.getElementById('timerBox').style.display = 'none';
            msg.textContent = '✅ Password reset successfully! Redirecting to login...';
            msg.className = 'msg ok';
            setTimeout(() => { window.location.href = '/'; }, 2000);
        } else {
            msg.textContent = '❌ ' + (data.error || 'Reset failed. Try requesting a new link.');
            msg.className = 'msg err';
            btn.disabled = false;
            btn.textContent = 'Reset Password';

            // If link was already used or expired, show expired screen
            if (data.error && (data.error.includes('expired') || data.error.includes('used') || data.error.includes('Invalid'))) {
                setTimeout(showExpired, 2000);
            }
        }
    } catch (err) {
        msg.textContent = '❌ Server error. Is Flask running?';
        msg.className = 'msg err';
        btn.disabled = false;
        btn.textContent = 'Reset Password';
    }
}

// ── Init ──────────────────────────────────────────────────────
if (!TOKEN || !EMAIL) {
    showExpired();
} else {
    startTimer();
}
</script>
</body>
</html>
