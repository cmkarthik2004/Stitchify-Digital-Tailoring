<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stitchify — Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Montserrat:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #0c7bb3; --blue-dk: #095e8a; --blue-lt: #e0f2fb;
      --pink: #f2bae8; --mid: #4a5568; --input-bg: #f4f8fc; --input-border: #cde4f0;
    }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #eef4fb 0%, #fce8f8 100%);
      font-family: 'DM Sans', sans-serif; padding: 20px;
    }
    .blob-pink { position:fixed;top:-40px;right:-40px;width:200px;height:200px;background:var(--pink);border-radius:50%;opacity:.65;filter:blur(50px);z-index:0;pointer-events:none; }
    .blob-blue { position:fixed;bottom:-50px;left:-50px;width:220px;height:220px;background:var(--blue);border-radius:50%;opacity:.45;filter:blur(50px);z-index:0;pointer-events:none; }
    .card {
      position:relative; z-index:1; background:#fff; border-radius:28px; padding:48px 44px;
      box-shadow:0 30px 80px rgba(12,123,179,.18), 0 8px 24px rgba(242,186,232,.2);
      width:100%; max-width:420px; text-align:center;
      animation: cardIn .6s cubic-bezier(0.34,1.2,0.64,1) both;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(30px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
    .logo { font-size:42px; margin-bottom:16px; }
    h2 { font-family:'Montserrat',sans-serif; font-size:24px; font-weight:800; color:var(--blue); margin-bottom:8px; }
    .subtitle { color:var(--mid); font-size:14px; margin-bottom:28px; line-height:1.6; }
    .input-wrap { position:relative; width:100%; margin-bottom:16px; }
    .input-wrap svg {
      position:absolute; left:14px; top:50%; transform:translateY(-50%);
      width:16px; height:16px; stroke:var(--blue); fill:none; stroke-width:2;
      pointer-events:none; opacity:.7;
    }
    .input-wrap input {
      width:100%; background:var(--input-bg); border:1.5px solid var(--input-border);
      border-radius:10px; padding:13px 16px 13px 40px;
      font-family:'Nunito',sans-serif; font-size:14px; color:#333; outline:none;
      transition:border-color .3s, box-shadow .3s;
    }
    .input-wrap input:focus { border-color:var(--blue); background:#fff; box-shadow:0 4px 14px rgba(12,123,179,.14); }
    .input-wrap input.invalid { border-color:#e74c3c; }
    .btn {
      width:100%; background:linear-gradient(135deg,#0c7bb3 0%,#a78fe8 60%,#f2bae8 100%);
      color:#fff; border:none; border-radius:30px; padding:14px;
      font-family:'Nunito',sans-serif; font-size:14px; font-weight:800;
      letter-spacing:1.8px; text-transform:uppercase; cursor:pointer;
      box-shadow:0 6px 22px rgba(12,123,179,.3); transition:all .3s;
    }
    .btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 10px 30px rgba(12,123,179,.4); }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .msg { margin-top:16px; padding:10px 16px; border-radius:10px; font-size:13px; font-weight:600; display:none; }
    .msg.success { background:#e7f9f0; color:#1a7a4a; display:block; }
    .msg.error   { background:#fdecea; color:#c0392b; display:block; }
    .back-link { margin-top:22px; font-size:13px; color:var(--mid); }
    .back-link a { color:var(--blue); font-weight:700; text-decoration:none; }
    .back-link a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="blob-pink"></div>
  <div class="blob-blue"></div>

  <div class="card">
    <div class="logo">🔑</div>
    <h2>Forgot Password?</h2>
    <p class="subtitle">
      Enter your registered email address and we'll send you a secure link to reset your password.
    </p>

    <div class="input-wrap">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z" fill="none"/><polyline points="22,6 12,13 2,6"/></svg>
      <input
        type="email"
        id="emailInput"
        placeholder="Enter your email address"
        autocomplete="email"
        oninput="clearError()"
      />
    </div>

    <button class="btn" id="submitBtn" onclick="requestReset()">Send Reset Link</button>

    <div class="msg" id="msg"></div>
    <div class="back-link"><a href="index.html">← Back to Login</a></div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000/api';

    // FIX: proper email format validation on the frontend too
    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
    }

    function clearError() {
      document.getElementById('emailInput').classList.remove('invalid');
      const el = document.getElementById('msg');
      el.className = 'msg';
      el.textContent = '';
    }

    async function requestReset() {
      const emailEl = document.getElementById('emailInput');
      const email   = emailEl.value.trim();

      if (!email || !isValidEmail(email)) {
        emailEl.classList.add('invalid');
        showMsg('Please enter a valid email address.', 'error');
        emailEl.focus();
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Sending…';

      try {
        const res  = await fetch(API_BASE + '/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (res.ok) {
          showMsg('📬 ' + data.message, 'success');
          btn.textContent = 'Email Sent ✓';
          // Don't re-enable button — one request is enough
        } else {
          showMsg(data.error || 'Something went wrong. Please try again.', 'error');
          btn.disabled = false;
          btn.textContent = 'Send Reset Link';
        }
      } catch (err) {
        showMsg('Network error — is the backend running?', 'error');
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    }

    // Allow pressing Enter
    document.getElementById('emailInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') requestReset();
    });
  </script>
</body>
</html>
