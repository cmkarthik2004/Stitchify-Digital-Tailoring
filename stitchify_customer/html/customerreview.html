<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stitchify – Reviews</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<style>
:root{
  --primary:#0c7bb3;--primary-dk:#095e8a;--primary-lt:#e8f4fb;
  --accent:#a75c9a;--accent-lt:#f3e8fb;
  --gradient:linear-gradient(135deg,#0c7bb3,#a75c9a);
  --success:#16a34a;--warning:#f59e0b;--danger:#ef4444;
  --white:#fff;--bg:#f4f6fa;--border:#e0e7ef;
  --text:#1a1a2e;--text-mid:#4a4a6a;--text-light:#9aaac4;
  --shadow:0 4px 20px rgba(12,123,179,0.08);--shadow-lg:0 12px 40px rgba(12,123,179,0.14);
  --radius-sm:10px;--radius:16px;--radius-lg:22px;
  --font-display:'Playfair Display',serif;--font-body:'DM Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.5}

/* HEADER */
.header{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:22px;font-weight:700;font-family:var(--font-display)}
.brand-s{color:var(--primary)}.brand-i{color:var(--accent)}
.back-btn{display:flex;align-items:center;gap:7px;padding:7px 16px;border-radius:30px;background:var(--primary-lt);color:var(--primary);text-decoration:none;font-size:13px;font-weight:600}
.back-btn:hover{background:var(--primary);color:white}

/* HERO STRIP */
.tailor-strip{background:var(--gradient);padding:24px 32px;color:white;display:flex;align-items:center;gap:20px}
.strip-avatar{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,0.8);background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;overflow:hidden;flex-shrink:0}
.strip-avatar img{width:100%;height:100%;object-fit:cover}
.strip-info h2{font-size:20px;font-weight:700;margin-bottom:2px}
.strip-info p{font-size:13px;opacity:0.85}
.strip-stats{margin-left:auto;display:flex;gap:28px;text-align:center}
.strip-stat-num{font-size:22px;font-weight:700}
.strip-stat-lbl{font-size:10px;opacity:0.75;text-transform:uppercase;letter-spacing:.5px}

/* MAIN LAYOUT */
.main{max-width:760px;margin:0 auto;padding:28px 20px}

/* WRITE REVIEW CARD */
.write-card{background:var(--white);border-radius:var(--radius-lg);padding:24px;margin-bottom:28px;border:1px solid var(--border);box-shadow:var(--shadow)}
.write-card h3{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.write-card h3 i{color:var(--primary)}
.star-select{display:flex;gap:6px;margin-bottom:16px}
.star-select i{font-size:28px;color:#ddd;cursor:pointer;transition:color .15s}
.star-select i.active,.star-select i:hover{color:var(--warning)}
.review-textarea{width:100%;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-family:var(--font-body);font-size:14px;resize:vertical;min-height:90px;outline:none;transition:border-color .2s}
.review-textarea:focus{border-color:var(--primary)}
.submit-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.char-count{font-size:11px;color:var(--text-light)}
.btn-submit{padding:10px 24px;border-radius:30px;background:var(--gradient);color:white;border:none;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px}
.btn-submit:hover{opacity:.9}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}

/* REVIEWS LIST */
.reviews-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.reviews-head h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.reviews-head h3 i{color:var(--primary)}
.sort-select{border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;font-family:var(--font-body);outline:none;cursor:pointer}

/* REVIEW CARD — Instagram style */
.review-card{background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
.rc-header{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.rc-avatar{width:40px;height:40px;border-radius:50%;background:var(--primary-lt);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--primary);font-size:16px;flex-shrink:0}
.rc-name{font-weight:600;font-size:14px;color:var(--text)}
.rc-date{font-size:11px;color:var(--text-light)}
.rc-stars{color:var(--warning);font-size:12px;letter-spacing:1px;margin-top:1px}
.rc-badge{margin-left:auto;background:var(--primary-lt);color:var(--primary);font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px}
.rc-badge.verified{background:#f0fdf4;color:var(--success)}

.rc-body{padding:0 16px 12px}
.rc-text{font-size:14px;color:var(--text-mid);line-height:1.65}
.rc-text.clamped{display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.read-more{font-size:12px;color:var(--primary);cursor:pointer;font-weight:600;margin-top:4px;display:inline-block}

/* ACTIONS BAR */
.rc-actions{padding:8px 16px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:20px}
.rc-action-btn{display:flex;align-items:center;gap:6px;background:none;border:none;font-size:13px;color:var(--text-mid);cursor:pointer;font-family:var(--font-body);padding:4px 0;transition:color .2s}
.rc-action-btn:hover{color:var(--primary)}
.rc-action-btn.liked{color:#ef4444}
.rc-action-btn.liked i{color:#ef4444}
.rc-action-btn i{font-size:15px}

/* TAILOR REPLY */
.rc-reply{margin:0 16px 14px;padding:10px 14px;background:var(--primary-lt);border-radius:var(--radius-sm);border-left:3px solid var(--primary)}
.rc-reply-lbl{font-size:10px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.rc-reply-text{font-size:13px;color:var(--text-mid);line-height:1.55}

/* COMMENTS */
.rc-comments{padding:0 16px 14px;display:none}
.rc-comments.open{display:block}
.comment-item{display:flex;gap:9px;margin-bottom:10px}
.comment-avatar{width:28px;height:28px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--primary);flex-shrink:0;border:1px solid var(--border)}
.comment-bubble{background:var(--bg);border-radius:12px;padding:8px 12px;flex:1}
.comment-name{font-size:12px;font-weight:700;color:var(--text)}
.comment-text{font-size:13px;color:var(--text-mid)}
.comment-time{font-size:10px;color:var(--text-light);margin-top:2px}
.comment-input-row{display:flex;gap:8px;margin-top:8px}
.comment-input{flex:1;border:1.5px solid var(--border);border-radius:30px;padding:7px 14px;font-size:13px;font-family:var(--font-body);outline:none}
.comment-input:focus{border-color:var(--primary)}
.comment-send{width:34px;height:34px;border-radius:50%;background:var(--primary);color:white;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.comment-send:hover{background:var(--primary-dk)}

/* RATING SUMMARY */
.rating-summary{background:var(--white);border-radius:var(--radius);padding:20px 24px;margin-bottom:20px;border:1px solid var(--border);display:flex;gap:32px;align-items:center}
.rs-big{text-align:center;min-width:80px}
.rs-num{font-size:52px;font-weight:700;color:var(--primary);font-family:var(--font-display);line-height:1}
.rs-stars{color:var(--warning);font-size:16px;margin:4px 0}
.rs-count{font-size:12px;color:var(--text-light)}
.rs-bars{flex:1}
.rs-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.rs-bar-lbl{font-size:12px;color:var(--text-mid);width:28px;text-align:right}
.rs-bar-track{flex:1;height:7px;background:var(--bg);border-radius:5px;overflow:hidden}
.rs-bar-fill{height:100%;background:var(--gradient);border-radius:5px}
.rs-bar-pct{font-size:11px;color:var(--text-light);width:30px}

.empty{text-align:center;padding:48px 20px;color:var(--text-light)}
.empty i{font-size:44px;margin-bottom:12px}
.empty p{font-size:14px}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a2340;color:white;padding:11px 22px;border-radius:50px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .3s;font-size:13px;font-weight:500}
.toast.show{opacity:1}

.login-prompt{background:var(--white);border:1.5px dashed var(--border);border-radius:var(--radius-lg);padding:24px;text-align:center;margin-bottom:28px}
.login-prompt p{font-size:14px;color:var(--text-mid);margin-bottom:12px}
.btn-login{padding:9px 22px;border-radius:30px;background:var(--gradient);color:white;border:none;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
</style>
</head>
<body>

<header class="header">
  <div class="brand"><span class="brand-s">Stitch</span><span class="brand-i">ify</span></div>
  <a href="#" class="back-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i> Back</a>
</header>

<!-- Tailor Strip -->
<div class="tailor-strip">
  <div class="strip-avatar" id="stripAvatar">👤</div>
  <div class="strip-info">
    <h2 id="stripTailorName">Loading…</h2>
    <p id="stripShopName"></p>
  </div>
  <div class="strip-stats">
    <div><div class="strip-stat-num" id="stripRating">—</div><div class="strip-stat-lbl">Rating</div></div>
    <div><div class="strip-stat-num" id="stripReviewCount">0</div><div class="strip-stat-lbl">Reviews</div></div>
  </div>
</div>

<div class="main">

  <!-- Rating Summary -->
  <div class="rating-summary" id="ratingSummary" style="display:none">
    <div class="rs-big">
      <div class="rs-num" id="rsNum">0.0</div>
      <div class="rs-stars" id="rsStars">☆☆☆☆☆</div>
      <div class="rs-count" id="rsCount">0 ratings</div>
    </div>
    <div class="rs-bars" id="rsBars"></div>
  </div>

  <!-- Write Review -->
  <div id="writeSection"></div>

  <!-- Reviews List -->
  <div class="reviews-head">
    <h3><i class="fas fa-comments"></i> All Reviews</h3>
    <select class="sort-select" id="sortSelect" onchange="sortAndRender()">
      <option value="newest">Newest First</option>
      <option value="top">Top Rated</option>
      <option value="most_liked">Most Liked</option>
    </select>
  </div>
  <div id="reviewsList"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const token = localStorage.getItem('token');
const user  = JSON.parse(localStorage.getItem('user') || '{}');
const params = new URLSearchParams(window.location.search);
const tailorId = params.get('tailor_id') || params.get('id');
// Debug: log what we have
console.log('Token:', token ? 'present' : 'MISSING');
console.log('User:', user);
console.log('User role:', user.role);
console.log('TailorId from URL:', tailorId);

if (!tailorId) { window.location.href = '/customer'; }

let allReviews = [];
let selectedRating = 0;
let currentTailor = null;

/* ── helpers ── */
function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 3000);
}
function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
}
function initials(name) {
  return (name || 'U').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
}

/* ── Load tailor info ── */
async function loadTailor() {
  try {
    const r = await fetch(`/api/tailor/public-profile/${tailorId}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!r.ok) throw new Error();
    currentTailor = await r.json();

    document.getElementById('stripTailorName').textContent = currentTailor.owner_name || currentTailor.shop_name;
    document.getElementById('stripShopName').textContent   = currentTailor.shop_name || '';
    document.getElementById('stripRating').textContent     = currentTailor.rating || '—';
    document.getElementById('stripReviewCount').textContent= currentTailor.total_reviews || 0;

    const av = document.getElementById('stripAvatar');
    if (currentTailor.profile_photo || currentTailor.avatar_url) {
      av.innerHTML = `<img src="${currentTailor.profile_photo || currentTailor.avatar_url}" alt="avatar">`;
    } else {
      av.textContent = (currentTailor.owner_name || 'T').charAt(0);
    }
  } catch(_) {
    document.getElementById('stripTailorName').textContent = 'Tailor';
  }
}

/* ── Load reviews ── */
async function loadReviews() {
  try {
    const r = await fetch(`/api/reviews/${tailorId}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    allReviews = r.ok ? await r.json() : [];
  } catch(_) { allReviews = []; }

  renderSummary();
  renderWriteSection();
  sortAndRender();
}

/* ── Rating summary ── */
function renderSummary() {
  if (!allReviews.length) return;
  document.getElementById('ratingSummary').style.display = 'flex';

  const total = allReviews.length;
  const avg   = (allReviews.reduce((s, r) => s + r.rating, 0) / total).toFixed(1);
  const counts = {5:0,4:0,3:0,2:0,1:0};
  allReviews.forEach(r => { if (counts[r.rating] !== undefined) counts[r.rating]++; });

  document.getElementById('rsNum').textContent   = avg;
  document.getElementById('rsStars').textContent = '★'.repeat(Math.round(avg)) + '☆'.repeat(5 - Math.round(avg));
  document.getElementById('rsCount').textContent = `${total} rating${total !== 1 ? 's' : ''}`;

  document.getElementById('rsBars').innerHTML = [5,4,3,2,1].map(s => {
    const pct = Math.round(counts[s] / total * 100);
    return `<div class="rs-bar-row">
      <span class="rs-bar-lbl">${s} ★</span>
      <div class="rs-bar-track"><div class="rs-bar-fill" style="width:${pct}%"></div></div>
      <span class="rs-bar-pct">${pct}%</span>
    </div>`;
  }).join('');
}

/* ── Write review section ── */
function renderWriteSection() {
  const ws = document.getElementById('writeSection');

  // Check if user already reviewed
  const myReview = user.id ? allReviews.find(r => r.customer_id === user.id) : null;

  if (!token || !user.id) {
    ws.innerHTML = `
      <div class="login-prompt">
        <p><i class="fas fa-lock" style="margin-right:6px;color:var(--primary)"></i>Login to write a review</p>
        <a class="btn-login" href="/?redirect=${encodeURIComponent(window.location.href)}">
          <i class="fas fa-sign-in-alt"></i> Login / Sign Up
        </a>
      </div>`;
    return;
  }

  if (myReview) {
    ws.innerHTML = `
      <div class="write-card" style="border-color:#d1fae5;background:#f0fdf4">
        <h3><i class="fas fa-check-circle" style="color:var(--success)"></i> Your Review</h3>
        <div style="color:var(--warning);font-size:20px;margin-bottom:8px">${'★'.repeat(myReview.rating)}${'☆'.repeat(5-myReview.rating)}</div>
        <p style="font-size:14px;color:var(--text-mid)">${myReview.comment}</p>
        <p style="font-size:11px;color:var(--text-light);margin-top:8px">Posted ${new Date(myReview.created_at).toLocaleDateString()}</p>
      </div>`;
    return;
  }

  ws.innerHTML = `
    <div class="write-card">
      <h3><i class="fas fa-pen"></i> Write a Review</h3>
      <div class="star-select" id="starSelect">
        ${[1,2,3,4,5].map(n => `<i class="far fa-star" data-star="${n}" onclick="selectStar(${n})"></i>`).join('')}
      </div>
      <textarea class="review-textarea" id="reviewText" placeholder="Share your experience with this tailor…" maxlength="500" oninput="updateCharCount()"></textarea>
      <div class="submit-row">
        <span class="char-count"><span id="charCount">0</span>/500</span>
        <button class="btn-submit" onclick="submitReview()" id="submitBtn" disabled>
          <i class="fas fa-paper-plane"></i> Post Review
        </button>
      </div>
    </div>`;
}

function selectStar(n) {
  selectedRating = n;
  document.querySelectorAll('#starSelect i').forEach((el, i) => {
    el.className = i < n ? 'fas fa-star active' : 'far fa-star';
  });
  checkSubmitReady();
}

function updateCharCount() {
  const txt = document.getElementById('reviewText').value;
  document.getElementById('charCount').textContent = txt.length;
  checkSubmitReady();
}

function checkSubmitReady() {
  const btn = document.getElementById('submitBtn');
  if (!btn) return;
  const txt = (document.getElementById('reviewText')?.value || '').trim();
  btn.disabled = !(selectedRating > 0 && txt.length >= 1);
}

async function submitReview() {
  const text = document.getElementById('reviewText').value.trim();
  if (!selectedRating || text.length < 10) { toast('Please add a rating and at least 10 characters'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Posting…';

  try {
    const r = await fetch('/api/reviews/add', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        tailor_id:     currentTailor?.tailor_code || tailorId,
        customer_id:   user.id,
        customer_name: user.name || 'Customer',
        rating:        selectedRating,
        comment:       text,
      })
    });
    if (!r.ok) {
      const errData = await r.json().catch(() => ({}));
      throw new Error(errData.error || `HTTP ${r.status}`);
    }
  } catch(err) {
    const errMsg = err.message || 'Unknown error';
    toast('❌ ' + errMsg);
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Post Review';
  }
}

/* ── Sort & render reviews ── */
function sortAndRender() {
  const sort = document.getElementById('sortSelect').value;
  let sorted = [...allReviews];
  if (sort === 'top')        sorted.sort((a,b) => b.rating - a.rating);
  else if (sort === 'most_liked') sorted.sort((a,b) => (b.likes||0) - (a.likes||0));
  else                       sorted.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

  const list = document.getElementById('reviewsList');
  if (!sorted.length) {
    list.innerHTML = `<div class="empty"><i class="fas fa-star-half-alt"></i><p>No reviews yet. Be the first to review!</p></div>`;
    return;
  }
  list.innerHTML = sorted.map(r => reviewCardHTML(r)).join('');
}

function reviewCardHTML(r) {
  const stars   = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
  const dateStr = new Date(r.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
  const likedByMe = (r.liked_by || []).includes(user.id);
  const comments  = r.comments || [];
  const isLong    = (r.comment || '').length > 200;
  const isMyReview = r.customer_id === user.id;

  return `<div class="review-card" id="rc-${r._id}">
    <div class="rc-header">
      <div class="rc-avatar">${initials(r.customer_name)}</div>
      <div>
        <div class="rc-name">${r.customer_name || 'Customer'}${isMyReview ? ' <span style="font-size:10px;color:var(--primary)">(You)</span>' : ''}</div>
        <div class="rc-stars">${stars}</div>
        <div class="rc-date">${dateStr}</div>
      </div>
      ${r.verified_purchase ? '<span class="rc-badge verified"><i class="fas fa-check"></i> Verified</span>' : ''}
    </div>

    <div class="rc-body">
      <div class="rc-text${isLong ? ' clamped' : ''}" id="rct-${r._id}">${r.comment || ''}</div>
      ${isLong ? `<span class="read-more" onclick="expandReview('${r._id}')">Read more</span>` : ''}
    </div>

    ${r.tailor_reply ? `
    <div class="rc-reply">
      <div class="rc-reply-lbl"><i class="fas fa-store"></i> Tailor's Reply</div>
      <div class="rc-reply-text">${r.tailor_reply}</div>
    </div>` : ''}

    <div class="rc-actions">
      <button class="rc-action-btn${likedByMe ? ' liked' : ''}" onclick="toggleLike('${r._id}',${likedByMe})" id="like-btn-${r._id}">
        <i class="${likedByMe ? 'fas' : 'far'} fa-heart"></i>
        <span id="like-count-${r._id}">${r.likes || 0}</span>
      </button>
      <button class="rc-action-btn" onclick="toggleComments('${r._id}')">
        <i class="far fa-comment"></i>
        <span>${comments.length}</span> Comments
      </button>
    </div>

    <!-- Comments -->
    <div class="rc-comments" id="comments-${r._id}">
      ${comments.map(c => `
        <div class="comment-item">
          <div class="comment-avatar">${initials(c.author_name)}</div>
          <div class="comment-bubble">
            <div class="comment-name">${c.author_name}</div>
            <div class="comment-text">${c.text}</div>
            <div class="comment-time">${new Date(c.created_at).toLocaleDateString()}</div>
          </div>
        </div>`).join('')}
      ${token && user.id ? `
        <div class="comment-input-row">
          <input class="comment-input" id="ci-${r._id}" placeholder="Add a comment…" onkeydown="if(event.key==='Enter')postComment('${r._id}')"/>
          <button class="comment-send" onclick="postComment('${r._id}')"><i class="fas fa-paper-plane" style="font-size:12px"></i></button>
        </div>` : `<p style="font-size:12px;color:var(--text-light);padding:4px 0"><a href="/" style="color:var(--primary)">Login</a> to comment</p>`}
    </div>
  </div>`;
}

function expandReview(id) {
  const el = document.getElementById('rct-'+id);
  el.classList.remove('clamped');
  el.nextElementSibling?.remove();
}

function toggleComments(id) {
  const el = document.getElementById('comments-'+id);
  el.classList.toggle('open');
}

async function toggleLike(reviewId, alreadyLiked) {
  if (!token || !user.id) { toast('Login to like reviews'); return; }
  const endpoint = alreadyLiked ? '/api/reviews/unlike' : '/api/reviews/like';
  try {
    const r = await fetch(endpoint, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ review_id: reviewId, user_id: user.id })
    });
    if (!r.ok) throw new Error();
    const data = await r.json();
    // Update button
    const btn   = document.getElementById(`like-btn-${reviewId}`);
    const count = document.getElementById(`like-count-${reviewId}`);
    const nowLiked = !alreadyLiked;
    btn.className = `rc-action-btn${nowLiked ? ' liked' : ''}`;
    btn.querySelector('i').className = `${nowLiked ? 'fas' : 'far'} fa-heart`;
    btn.onclick = () => toggleLike(reviewId, nowLiked);
    count.textContent = data.likes;
  } catch(_) { toast('Could not update like'); }
}

async function postComment(reviewId) {
  const input = document.getElementById('ci-'+reviewId);
  const text  = input.value.trim();
  if (!text) return;
  input.value = '';
  try {
    await fetch('/api/reviews/comment', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        review_id:   reviewId,
        author_id:   user.id,
        author_name: user.name || 'User',
        text
      })
    });
    await loadReviews(); // reload to show new comment
  } catch(_) { toast('Could not post comment'); }
}

/* ── Boot ── */
(async () => {
  await loadTailor();
  await loadReviews();
})();
</script>
