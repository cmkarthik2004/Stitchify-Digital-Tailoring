<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stitchify – Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<style>
:root {
  --primary: #0c7bb3;
  --primary-dark: #095f8a;
  --primary-soft: #e8f4fb;
  --accent: #a75c9a;
  --accent-light: #f3e8fb;
  --gradient: linear-gradient(135deg, #0c7bb3 0%, #a75c9a 100%);
  --gradient-h: linear-gradient(90deg, #0c7bb3, #a75c9a);
  --white: #ffffff;
  --bg: #f4f6fa;
  --border: #e0e7ef;
  --text: #1a1a2e;
  --text-main: #1a2340;
  --text-mid: #4a4a6a;
  --text-soft: #5a6a8a;
  --text-light: #9aaac4;
  --shadow-sm: 0 2px 10px rgba(12,123,179,0.07);
  --shadow: 0 4px 20px rgba(12,123,179,0.10);
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 24px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', sans-serif;
  --tr: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --sz-xs: 11px; --sz-sm: 13px; --sz-base: 14px;
  --fw-reg: 400; --fw-med: 500; --fw-semi: 600; --fw-bold: 700;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Brand bar ── */
.brand-bar { text-align: center; padding: 14px 0 4px; background: var(--white); }
.brand-name { font-size: 36px; font-weight: var(--fw-bold); letter-spacing: 3px; font-family: var(--font-display); display: inline-block; }
.brand-stitch { color: var(--primary); }
.brand-ify { color: var(--accent); }
.brand-tagline { font-size: var(--sz-xs); color: var(--text-light); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }

/* ── Navbar ── */
.snav-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 32px; background: var(--white);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(12,123,179,0.06);
}
.snav-search {
  display: flex; align-items: center;
  background: #f5f6fa; border: 1.5px solid var(--border);
  border-radius: 24px; padding: 7px 18px; gap: 8px; width: 360px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.snav-search:focus-within { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 3px rgba(12,123,179,0.09); }
.snav-search input { border: none; outline: none; font-size: var(--sz-sm); color: #444; background: transparent; width: 100%; font-family: var(--font-body); }
.snav-search input::placeholder { color: #b0b8c1; }
.snav-links { display: flex; align-items: center; margin-left: auto; gap: 2px; }
.snav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 14px; border-radius: 12px; text-decoration: none; cursor: pointer;
  transition: background 0.2s, color 0.2s; position: relative;
}
.snav-item:hover { background: var(--primary-soft); }
.snav-item:hover .snav-icon, .snav-item:hover .snav-lbl { color: var(--primary); }
.snav-item.active .snav-icon, .snav-item.active .snav-lbl { color: var(--accent); font-weight: 700; }
.snav-item.active::after {
  content: ''; position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
  width: 20px; height: 2px; background: var(--gradient-h); border-radius: 2px;
}
.snav-icon { font-size: 16px; color: #9ca3af; transition: color 0.2s; line-height: 1; }
.snav-lbl { font-size: 10px; font-weight: var(--fw-semi); letter-spacing: 0.5px; text-transform: uppercase; color: #9ca3af; transition: color 0.2s; }
.nav-badge {
  position: absolute; top: -5px; right: -6px;
  background: var(--gradient); color: white; font-size: 9px; font-weight: 700;
  min-width: 16px; height: 16px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; padding: 0 3px;
}
.divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 0 32px; }

/* ── Chat layout ── */
.chat-container {
  display: flex; flex: 1; max-width: 1400px; margin: 0 auto;
  width: 100%; height: calc(100vh - 130px);
}
.chat-sidebar {
  width: 340px; background: var(--white);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
.chat-header { padding: 20px; border-bottom: 1px solid var(--border); }
.chat-header h3 { color: var(--text-main); font-size: 16px; font-weight: var(--fw-semi); }
.chat-list { flex: 1; overflow-y: auto; }
.chat-item {
  padding: 16px 20px; display: flex; align-items: center; gap: 12px;
  cursor: pointer; transition: background 0.2s; border-bottom: 1px solid var(--border);
}
.chat-item:hover { background: var(--bg); }
.chat-item.active { background: var(--primary-soft); border-left: 3px solid var(--primary); }
.chat-avatar {
  width: 48px; height: 48px; border-radius: 50%; background: var(--gradient);
  display: flex; align-items: center; justify-content: center;
  color: white; font-weight: var(--fw-bold); flex-shrink: 0; font-size: 14px;
}
.chat-info { flex: 1; min-width: 0; }
.chat-name { font-weight: var(--fw-semi); color: var(--text-main); margin-bottom: 4px; font-size: 14px; }
.chat-last-msg { font-size: 12px; color: var(--text-light); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-time { font-size: 10px; color: var(--text-light); }
.unread-badge { background: var(--accent); color: white; border-radius: 12px; padding: 2px 8px; font-size: 10px; font-weight: var(--fw-bold); }

/* ── Chat area ── */
.chat-area { flex: 1; display: flex; flex-direction: column; background: var(--white); }
.chat-area-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; background: #fafbfc;
}
.messages-container {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 12px; background: #fafbfc;
}
.message { display: flex; max-width: 75%; }
.message.sent { align-self: flex-end; }
.message.received { align-self: flex-start; }
.message-content { padding: 10px 16px; border-radius: 18px; font-size: 14px; line-height: 1.5; }
.message.received .message-content { background: var(--white); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.message.sent .message-content { background: var(--gradient); color: white; border-bottom-right-radius: 4px; }
.message-time { font-size: 10px; color: var(--text-light); margin-top: 4px; display: block; }
.message.sent .message-time { text-align: right; color: rgba(255,255,255,0.7); }

.chat-input-area {
  padding: 16px 20px; border-top: 1px solid var(--border);
  display: flex; gap: 12px; background: var(--white);
}
.chat-input {
  flex: 1; padding: 12px 16px; border: 1.5px solid var(--border);
  border-radius: 25px; font-family: var(--font-body); font-size: 14px; outline: none; transition: border-color 0.2s;
}
.chat-input:focus { border-color: var(--primary); }
.send-btn {
  width: 44px; height: 44px; border-radius: 50%; background: var(--gradient);
  border: none; color: white; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 14px rgba(12,123,179,0.3); }
.send-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.empty-chat { display: flex; align-items: center; justify-content: center; height: 100%; text-align: center; }
.quick-actions { display: flex; gap: 8px; margin-top: 8px; padding: 0 20px 16px; flex-wrap: wrap; }
.quick-btn {
  padding: 6px 14px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 20px; font-size: 11px; cursor: pointer; font-family: var(--font-body); transition: var(--tr);
}
.quick-btn:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }

/* ── Connection status ── */
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.status-dot.online { background: #16a34a; }
.status-dot.offline { background: #9ca3af; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: var(--text-main); color: white; padding: 12px 24px;
  border-radius: 50px; z-index: 10000; transition: all 0.3s;
  opacity: 0; pointer-events: none; font-weight: 500;
}
.toast.show { opacity: 1; }

/* ── Footer ── */
.dashboard-footer { background: var(--text-main); color: #8899aa; padding: 20px 32px; text-align: center; font-size: 12px; }

@media (max-width: 768px) {
  .snav-bar { padding: 8px 16px; }
  .snav-search { width: 200px; }
  .chat-sidebar { width: 260px; }
}
</style>
</head>
<body>

<div class="brand-bar">
  <div class="brand-name"><span class="brand-stitch">Stitch</span><span class="brand-ify">ify</span></div>
  <div class="brand-tagline">Customer Messages</div>
</div>

<nav class="snav-bar">
  <div class="snav-search">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="search" placeholder="Search messages..." oninput="filterChats(this.value)"/>
  </div>
  <div class="snav-links">
    <a class="snav-item" href="/customer"><i class="fas fa-home snav-icon"></i><span class="snav-lbl">Home</span></a>
    <a class="snav-item" href="/customer/orders"><i class="fas fa-box snav-icon"></i><span class="snav-lbl">My Orders</span></a>
    <a class="snav-item active" href="/customer/chat">
      <span style="position:relative;display:inline-block;">
        <i class="fas fa-comment-dots snav-icon"></i>
        <span class="nav-badge" id="chatBadge" style="display:none;">0</span>
      </span>
      <span class="snav-lbl">Chat</span>
    </a>
    <a class="snav-item" href="/customer/trends"><i class="fas fa-fire snav-icon"></i><span class="snav-lbl">Trends</span></a>
    <a class="snav-item" href="/customer/profile"><i class="fas fa-user snav-icon"></i><span class="snav-lbl">Profile</span></a>
  </div>
</nav>

<div class="divider"></div>

<div class="chat-container">
  <!-- Sidebar -->
  <div class="chat-sidebar">
    <div class="chat-header">
      <h3><i class="fas fa-comments"></i> Messages</h3>
    </div>
    <div class="chat-list" id="chat-list">
      <div style="text-align:center;padding:40px 20px;color:var(--text-light);">
        <i class="fas fa-spinner fa-pulse" style="font-size:24px;"></i>
        <p style="margin-top:12px;">Loading chats...</p>
      </div>
    </div>
  </div>

  <!-- Chat area -->
  <div class="chat-area" id="chat-area">
    <div class="empty-chat">
      <div>
        <i class="fas fa-comment-dots" style="font-size:56px;margin-bottom:16px;color:var(--text-light);"></i><br/>
        <span style="color:var(--text-light);">Select a conversation to start messaging</span>
      </div>
    </div>
  </div>
</div>

<footer class="dashboard-footer">
  <p>© 2025 <a href="/" style="color:var(--accent);text-decoration:none;">Stitchify</a> — Customer Portal.</p>
</footer>

<div id="toast" class="toast"></div>

<script>
// ── Auth ──
const token = localStorage.getItem('token');
const user  = JSON.parse(localStorage.getItem('user') || '{}');
if (!token || !user.id) { window.location.href = '/'; }

// ── State ──
let chats = [];
let currentChatId = null;
let currentMessages = [];
let pollInterval = null;
let chatRefreshInterval = null;
let isSending = false;
let isCreatingChat = false;

// ── Init ──
init();

async function init() {
  await fetchChats();
  // Start periodic chat list refresh (catches new chats from tailors)
  chatRefreshInterval = setInterval(fetchChats, 8000);

  // Handle selectedTailor from session (coming from tailor info page)
  const raw = sessionStorage.getItem('selectedTailor');
  if (raw) {
    sessionStorage.removeItem('selectedTailor');
    const tailor = JSON.parse(raw);
    const existing = chats.find(c => c.tailor_id === tailor.id || c.tailor_id === tailor.tailor_id);
    if (existing) {
      selectChat(existing._id);
    } else {
      await createOrGetChat(tailor.id || tailor.tailor_id, tailor.name || tailor.shop_name);
    }
  }
}

// ──────────────────────────────────────
// FETCH CHAT LIST
// ──────────────────────────────────────
async function fetchChats() {
  try {
    const res = await fetch(`/api/customer/chats/${user.id}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!res.ok) return;
    const data = await res.json();

    // Preserve messages already loaded locally
    chats = data.map(incoming => {
      const existing = chats.find(c => c._id === incoming._id);
      return existing ? { ...incoming, messages: existing.messages } : incoming;
    });

    renderChatList();
    updateBadge();

    // Auto-select first chat if none open
    if (!currentChatId && chats.length > 0) {
      selectChat(chats[0]._id);
    }
  } catch (e) {
    console.error('fetchChats error:', e);
  }
}

// ──────────────────────────────────────
// CREATE OR GET CHAT
// ──────────────────────────────────────
async function createOrGetChat(tailorId, tailorName) {
  if (isCreatingChat) return;
  isCreatingChat = true;
  showToast('Starting conversation…');
  try {
    const res = await fetch('/api/chat/get-or-create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({
        customer_id: user.id,
        customer_name: user.name,
        tailor_id: tailorId,
        tailor_name: tailorName
      })
    });
    const result = await res.json();
    if (result.success) {
      await fetchChats();
      if (result.chat_id) selectChat(result.chat_id);
    } else {
      showToast('Failed to start conversation');
    }
  } catch (e) {
    console.error('createOrGetChat error:', e);
    showToast('Error starting conversation');
  } finally {
    isCreatingChat = false;
  }
}

// ──────────────────────────────────────
// RENDER CHAT LIST
// ──────────────────────────────────────
function renderChatList() {
  const container = document.getElementById('chat-list');
  if (!chats.length) {
    container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-light);">
      <i class="fas fa-inbox" style="font-size:32px;"></i>
      <p style="margin-top:12px;">No messages yet</p>
    </div>`;
    return;
  }
  container.innerHTML = chats.map(chat => `
    <div class="chat-item ${currentChatId === chat._id ? 'active' : ''}" onclick="selectChat('${chat._id}')">
      <div class="chat-avatar">${avatarInitials(chat.tailor_name)}</div>
      <div class="chat-info">
        <div class="chat-name">${escHtml(chat.tailor_name)}</div>
        <div class="chat-last-msg">${escHtml(chat.last_message || 'No messages yet')}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div class="chat-time">${relTime(chat.last_message_time)}</div>
        ${chat.unread_count > 0 ? `<div class="unread-badge">${chat.unread_count}</div>` : ''}
      </div>
    </div>
  `).join('');
}

function filterChats(q) {
  if (!q) { renderChatList(); return; }
  const lower = q.toLowerCase();
  const container = document.getElementById('chat-list');
  const filtered = chats.filter(c => (c.tailor_name || '').toLowerCase().includes(lower));
  if (!filtered.length) { container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);">No matches</div>'; return; }
  container.innerHTML = filtered.map(chat => `
    <div class="chat-item ${currentChatId === chat._id ? 'active' : ''}" onclick="selectChat('${chat._id}')">
      <div class="chat-avatar">${avatarInitials(chat.tailor_name)}</div>
      <div class="chat-info">
        <div class="chat-name">${escHtml(chat.tailor_name)}</div>
        <div class="chat-last-msg">${escHtml(chat.last_message || 'No messages yet')}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div class="chat-time">${relTime(chat.last_message_time)}</div>
        ${chat.unread_count > 0 ? `<div class="unread-badge">${chat.unread_count}</div>` : ''}
      </div>
    </div>
  `).join('');
}

function updateBadge() {
  const total = chats.reduce((s, c) => s + (c.unread_count || 0), 0);
  const el = document.getElementById('chatBadge');
  if (el) { el.textContent = total; el.style.display = total > 0 ? 'flex' : 'none'; }
}

// ──────────────────────────────────────
// SELECT CHAT
// ──────────────────────────────────────
async function selectChat(chatId) {
  if (currentChatId === chatId) return;
  currentChatId = chatId;
  renderChatList();
  renderChatArea(); // render shell immediately
  await loadMessages();
  markRead();

  // Reset polling for this chat
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(pollMessages, 3000);
}

// ──────────────────────────────────────
// LOAD MESSAGES
// ──────────────────────────────────────
async function loadMessages() {
  if (!currentChatId) return;
  try {
    // FIX: correct endpoint is /api/chat/{chatId}/messages
    const res = await fetch(`/api/chat/${currentChatId}/messages`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!res.ok) return;
    const messages = await res.json();
    const chat = chats.find(c => c._id === currentChatId);
    if (chat) {
      chat.messages = messages;
      renderMessages(messages, chat);
      scrollToBottom();
    }
  } catch (e) {
    console.error('loadMessages error:', e);
  }
}

// ──────────────────────────────────────
// POLL FOR NEW MESSAGES
// ──────────────────────────────────────
async function pollMessages() {
  if (!currentChatId) return;
  try {
    const res = await fetch(`/api/chat/${currentChatId}/messages`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!res.ok) return;
    const messages = await res.json();
    const chat = chats.find(c => c._id === currentChatId);
    if (chat && messages.length !== (chat.messages || []).length) {
      chat.messages = messages;
      renderMessages(messages, chat);
      markRead();
      scrollToBottom();
      // Also refresh sidebar to update last_message preview
      fetchChats();
    }
  } catch (e) { /* silent */ }
}

// ──────────────────────────────────────
// RENDER CHAT AREA (shell + messages)
// ──────────────────────────────────────
function renderChatArea() {
  const chat = chats.find(c => c._id === currentChatId);
  if (!chat) return;
  const container = document.getElementById('chat-area');
  container.innerHTML = `
    <div class="chat-area-header">
      <div class="chat-avatar" style="width:40px;height:40px;font-size:13px;">${avatarInitials(chat.tailor_name)}</div>
      <div>
        <strong style="color:var(--text-main);">${escHtml(chat.tailor_name)}</strong>
        <div style="font-size:11px;color:var(--text-light);margin-top:2px;">
          <span class="status-dot online"></span>Active
        </div>
      </div>
    </div>
    <div class="messages-container" id="messages-container">
      <div style="text-align:center;color:var(--text-light);padding:20px;">
        <i class="fas fa-spinner fa-pulse"></i> Loading messages…
      </div>
    </div>
    <div class="chat-input-area">
      <input type="text" class="chat-input" id="messageInput" placeholder="Type a message…" onkeypress="handleKeyPress(event)" maxlength="1000"/>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
    <div class="quick-actions">
      <button class="quick-btn" onclick="sendQuick('measurements')">📏 My Measurements</button>
      <button class="quick-btn" onclick="sendQuick('track')">📍 Order Update</button>
      <button class="quick-btn" onclick="sendQuick('appointment')">📅 Book Appointment</button>
    </div>
  `;
}

function renderMessages(messages, chat) {
  const container = document.getElementById('messages-container');
  if (!container) return;
  if (!messages.length) {
    container.innerHTML = `<div style="text-align:center;color:var(--text-light);padding:40px;">Start the conversation! 👋</div>`;
    return;
  }
  container.innerHTML = messages.map(msg => {
    // FIX: customer sent = sender_role is 'customer'
    const isSent = msg.sender_role === 'customer';
    return `
      <div class="message ${isSent ? 'sent' : 'received'}">
        <div class="message-content">
          ${escHtml(msg.message)}
          <span class="message-time">${formatMsgTime(msg.timestamp)}</span>
        </div>
      </div>
    `;
  }).join('');
}

// ──────────────────────────────────────
// SEND MESSAGE
// ──────────────────────────────────────
async function sendMessage() {
  if (isSending) return;
  const input = document.getElementById('messageInput');
  const btn   = document.getElementById('sendBtn');
  const text  = input?.value.trim();
  if (!text || !currentChatId) return;

  isSending = true;
  if (btn) btn.disabled = true;

  // Optimistic UI: add message immediately
  const chat = chats.find(c => c._id === currentChatId);
  if (chat) {
    if (!chat.messages) chat.messages = [];
    chat.messages.push({
      message: text,
      sender_role: 'customer',   // FIX: must match what backend stores
      timestamp: new Date().toISOString(),
      optimistic: true
    });
    renderMessages(chat.messages, chat);
    scrollToBottom();
    input.value = '';
  }

  try {
    const res = await fetch(`/api/chat/${currentChatId}/send-message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({
        sender: 'customer',           // FIX: backend uses this as sender_role
        sender_name: user.name,
        message: text
      })
    });
    if (!res.ok) {
      showToast('Failed to send message');
      // Remove optimistic message
      if (chat && chat.messages) {
        chat.messages = chat.messages.filter(m => !m.optimistic);
        renderMessages(chat.messages, chat);
      }
    } else {
      // Reload real messages to replace optimistic ones
      await loadMessages();
      fetchChats(); // refresh sidebar preview
    }
  } catch (e) {
    showToast('Error sending message');
  } finally {
    isSending = false;
    if (btn) btn.disabled = false;
  }
}

async function sendQuick(type) {
  if (!currentChatId) { showToast('Select a conversation first'); return; }
  const map = {
    measurements: 'Here are my measurements: Chest: 40", Waist: 32", Length: 42"',
    track:         'Can you please provide an update on my order?',
    appointment:   "I'd like to book an appointment for measurements. When are you available?"
  };
  const input = document.getElementById('messageInput');
  if (input) { input.value = map[type]; }
  await sendMessage();
}

// ──────────────────────────────────────
// MARK READ
// ──────────────────────────────────────
async function markRead() {
  if (!currentChatId) return;
  try {
    await fetch(`/api/chat/${currentChatId}/read`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ user_id: user.id, role: 'customer' })
    });
    const chat = chats.find(c => c._id === currentChatId);
    if (chat) { chat.unread_count = 0; updateBadge(); renderChatList(); }
  } catch (e) { /* silent */ }
}

// ──────────────────────────────────────
// HELPERS
// ──────────────────────────────────────
function avatarInitials(name) {
  return (name || '?').substring(0, 2).toUpperCase();
}

function escHtml(text) {
  if (!text) return '';
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function relTime(ts) {
  if (!ts) return '';
  const diff = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (diff < 1)    return 'Now';
  if (diff < 60)   return `${diff}m ago`;
  if (diff < 1440) return `${Math.floor(diff/60)}h ago`;
  return `${Math.floor(diff/1440)}d ago`;
}

function formatMsgTime(ts) {
  return ts ? new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
}

function scrollToBottom() {
  setTimeout(() => {
    const el = document.getElementById('messages-container');
    if (el) el.scrollTop = el.scrollHeight;
  }, 60);
}

function handleKeyPress(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// Cleanup on leave
window.addEventListener('beforeunload', () => {
  if (pollInterval) clearInterval(pollInterval);
  if (chatRefreshInterval) clearInterval(chatRefreshInterval);
});
</script>
