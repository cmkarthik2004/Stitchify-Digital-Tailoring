<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stitchify – My Reviews | Tailor</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<style>
:root {
  --primary:#0c7bb3;--primary-dk:#095e8a;--primary-lt:#e8f4fb;
  --accent:#a75c9a;--accent-lt:#f3e8fb;
  --gradient:linear-gradient(135deg,#0c7bb3,#a75c9a);
  --success:#16a34a;--warning:#f59e0b;--danger:#ef4444;
  --white:#fff;--bg:#f4f6fa;--border:#e0e7ef;
  --text:#1a1a2e;--text-mid:#4a4a6a;--text-light:#9aaac4;
  --shadow:0 4px 20px rgba(12,123,179,0.08);
  --radius:16px;--radius-lg:22px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}

.nav-bar{background:white;border-bottom:1px solid var(--border);padding:12px 32px;display:flex;align-items:center;gap:28px;position:sticky;top:0;z-index:100}
.brand{font-size:24px;font-weight:700;font-family:'Playfair Display',serif}
.brand-s{color:var(--primary)}.brand-i{color:var(--accent)}
.nav-links{display:flex;gap:20px;margin-left:auto}
.nav-link{text-decoration:none;color:var(--text-mid);font-weight:500;padding:6px 12px;border-radius:30px}
.nav-link:hover,.nav-link.active{background:var(--primary-lt);color:var(--primary)}

.container{max-width:900px;margin:32px auto;padding:0 20px}
.header-card{background:var(--gradient);border-radius:var(--radius-lg);padding:28px 32px;color:white;margin-bottom:28px}
.header-card h1{font-size:24px;margin-bottom:8px}
.header-card p{opacity:0.85}
.stats-row{display:flex;gap:32px;margin-top:20px}
.stat{background:rgba(255,255,255,0.15);border-radius:16px;padding:12px 24px;text-align:center}
.stat-num{font-size:28px;font-weight:700}
.stat-label{font-size:11px;opacity:0.8}

.review-card{background:white;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:20px;overflow:hidden}
.rc-header{display:flex;align-items:center;gap:14px;padding:18px 20px 12px}
.rc-avatar{width:48px;height:48px;border-radius:50%;background:var(--primary-lt);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:var(--primary)}
.rc-info h4{font-size:15px;margin-bottom:2px}
.rc-stars{color:var(--warning);font-size:13px;margin:4px 0}
.rc-date{font-size:11px;color:var(--text-light)}
.rc-rating{background:var(--warning);color:white;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;margin-left:auto}
.rc-body{padding:0 20px 16px}
.rc-text{font-size:14px;color:var(--text-mid);line-height:1.6}
.rc-actions{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:24px}
.like-count{font-size:13px;color:var(--text-mid);display:flex;align-items:center;gap:5px}
.like-count i{color:#ef4444}
.reply-section{padding:0 20px 20px}
.reply-box{background:var(--primary-lt);border-radius:12px;padding:14px;margin-top:12px}
.reply-label{font-size:11px;font-weight:700;color:var(--primary);margin-bottom:5px}
.reply-text{font-size:13px;color:var(--text-mid)}
.reply-form{display:flex;gap:10px;margin-top:12px}
.reply-input{flex:1;border:1.5px solid var(--border);border-radius:30px;padding:10px 16px;font-size:13px;outline:none}
.reply-input:focus{border-color:var(--primary)}
.reply-btn{background:var(--primary);color:white;border:none;padding:8px 20px;border-radius:30px;cursor:pointer;font-weight:600}
.reply-btn:hover{background:var(--primary-dk)}
.no-reviews{text-align:center;padding:60px;background:white;border-radius:var(--radius);border:1px solid var(--border)}
.no-reviews i{font-size:48px;color:var(--text-light);margin-bottom:16px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a2340;color:white;padding:12px 24px;border-radius:50px;z-index:9999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
</style>
</head>
<body>

<nav class="nav-bar">
  <div class="brand"><span class="brand-s">Stitch</span><span class="brand-i">ify</span></div>
  <div class="nav-links">
    <a class="nav-link" href="/tailor"><i class="fas fa-home"></i> Home</a>
    <a class="nav-link" href="/tailor/orders"><i class="fas fa-box"></i> Orders</a>
    <a class="nav-link" href="/tailor/chat"><i class="fas fa-comment"></i> Chat</a>
    <a class="nav-link active" href="/tailor/reviews"><i class="fas fa-star"></i> Reviews</a>
    <a class="nav-link" href="/tailor/profile"><i class="fas fa-user"></i> Profile</a>
  </div>
</nav>

<div class="container">
  <div class="header-card">
    <h1><i class="fas fa-star"></i> Customer Reviews</h1>
    <p>See what customers are saying about your work</p>
    <div class="stats-row">
      <div class="stat"><div class="stat-num" id="totalReviews">0</div><div class="stat-label">Total Reviews</div></div>
      <div class="stat"><div class="stat-num" id="avgRating">0.0</div><div class="stat-label">Average Rating</div></div>
      <div class="stat"><div class="stat-num" id="totalLikes">0</div><div class="stat-label">Total Likes</div></div>
    </div>
  </div>

  <div id="reviewsList"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || '{}');

if (!token || !user.id || user.role !== 'tailor') {
  window.location.href = '/login-page';
}

let allReviews = [];

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 3000);
}

async function fetchReviews() {
  try {
    const response = await fetch(`/api/tailor/reviews/${user.id}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    allReviews = await response.json();
    
    // Calculate stats
    const total = allReviews.length;
    const avg = total > 0 ? (allReviews.reduce((s, r) => s + r.rating, 0) / total).toFixed(1) : '0.0';
    const totalLikes = allReviews.reduce((s, r) => s + (r.likes || 0), 0);
    
    document.getElementById('totalReviews').textContent = total;
    document.getElementById('avgRating').textContent = avg;
    document.getElementById('totalLikes').textContent = totalLikes;
    
    renderReviews();
  } catch (error) {
    console.error('Error:', error);
    showToast('Failed to load reviews');
  }
}

function renderReviews() {
  const container = document.getElementById('reviewsList');
  
  if (!allReviews.length) {
    container.innerHTML = `
      <div class="no-reviews">
        <i class="fas fa-star-half-alt"></i>
        <p>No reviews yet. Share your shop link with customers!</p>
      </div>`;
    return;
  }
  
  container.innerHTML = allReviews.map(review => `
    <div class="review-card" data-id="${review._id}">
      <div class="rc-header">
        <div class="rc-avatar">${getInitials(review.customer_name)}</div>
        <div class="rc-info">
          <h4>${escapeHtml(review.customer_name || 'Anonymous')}</h4>
          <div class="rc-stars">${'★'.repeat(review.rating)}${'☆'.repeat(5 - review.rating)}</div>
          <div class="rc-date">${formatDate(review.created_at)}</div>
        </div>
        <div class="rc-rating">${review.rating}.0 ★</div>
      </div>
      <div class="rc-body">
        <div class="rc-text">${escapeHtml(review.comment || 'No comment provided.')}</div>
      </div>
      <div class="rc-actions">
        <div class="like-count"><i class="fas fa-heart"></i> ${review.likes || 0} likes</div>
        <div class="like-count"><i class="fas fa-comment"></i> ${review.comments?.length || 0} comments</div>
      </div>
      <div class="reply-section">
        ${review.tailor_reply ? `
          <div class="reply-box">
            <div class="reply-label"><i class="fas fa-store"></i> Your Reply</div>
            <div class="reply-text">${escapeHtml(review.tailor_reply)}</div>
          </div>
        ` : `
          <div class="reply-form">
            <input type="text" class="reply-input" id="reply-${review._id}" placeholder="Write a reply to this customer...">
            <button class="reply-btn" onclick="submitReply('${review._id}')">Reply</button>
          </div>
        `}
      </div>
    </div>
  `).join('');
}

function getInitials(name) {
  return (name || 'U').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

function formatDate(dateStr) {
  if (!dateStr) return 'Recently';
  return new Date(dateStr).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

async function submitReply(reviewId) {
  const input = document.getElementById(`reply-${reviewId}`);
  const reply = input.value.trim();
  
  if (!reply) {
    showToast('Please enter a reply');
    return;
  }
  
  try {
    const response = await fetch('/api/reviews/tailor-reply', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({ review_id: reviewId, reply: reply })
    });
    
    if (response.ok) {
      showToast('✅ Reply posted successfully!');
      fetchReviews(); // Reload to show the reply
    } else {
      showToast('❌ Failed to post reply');
    }
  } catch (error) {
    showToast('❌ Error posting reply');
  }
}

// Load reviews on page load
fetchReviews();
</script>
</body>
</html>
