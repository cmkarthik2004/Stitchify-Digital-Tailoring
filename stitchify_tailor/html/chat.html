<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stitchify – Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Sora:wght@300;400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:#f5f6fa;color:#1a2340;overflow:hidden;height:100vh;display:flex;flex-direction:column;}

/* ── SINGLE UNIFIED HEADER (consistent with index.html) ── */
.header{
  background:#fff;
  border-bottom:1px solid #e0e7ef;
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;height:56px;gap:16px;
}
.brand{
  font-size:22px;font-weight:700;letter-spacing:1.5px;
  font-family:'Playfair Display',serif;white-space:nowrap;flex-shrink:0;
}
.brand-s{color:#0c7bb3}.brand-i{color:#a75c9a}
.header-nav{
  display:flex;align-items:center;gap:2px;flex-wrap:nowrap;overflow-x:auto;
  scrollbar-width:none;
}
.header-nav::-webkit-scrollbar{display:none}
.nav-link{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:8px;
  text-decoration:none;color:#4a4a6a;
  font-size:12px;font-weight:600;
  white-space:nowrap;transition:all 0.25s ease;
}
.nav-link i{font-size:13px}
.nav-link:hover{background:#e8f4fb;color:#0c7bb3}
.nav-link.active{background:linear-gradient(135deg,#0c7bb3,#a75c9a);color:white}

/* Main app layout */
.app{display:flex;flex-direction:column;height:calc(100vh - 56px);overflow:hidden;}
.chat-body{display:flex;flex:1;overflow:hidden;min-height:0;}

/* ── Sidebar ── */
.sidebar{width:340px;flex-shrink:0;background:#fff;border-right:1.5px solid #e5e9f0;display:flex;flex-direction:column;overflow:hidden;}
.sidebar-topbar{padding:14px 18px 8px;display:flex;align-items:center;justify-content:space-between;}
.sidebar-title{font-size:17px;font-weight:800;color:#1a2340;}
.sidebar-search{padding:0 14px 10px;}
.search-wrap{display:flex;align-items:center;gap:8px;background:#f5f6fa;border:1.5px solid #e5e9f0;border-radius:22px;padding:8px 14px;transition:border-color .18s,box-shadow .18s;}
.search-wrap:focus-within{border-color:#0c7bb3;box-shadow:0 0 0 3px rgba(12,123,179,.08);background:#fff;}
.search-wrap svg{width:14px;height:14px;color:#b0b8c1;flex-shrink:0;}
.search-box{border:none;outline:none;background:transparent;font-family:inherit;font-size:13px;color:#444;width:100%;}
.search-box::placeholder{color:#b0b8c1;}
.filter-row{display:flex;gap:7px;padding:0 14px 10px;}
.filter-chip{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:18px;border:1.5px solid #e5e9f0;background:#fff;font-family:inherit;font-size:12px;font-weight:700;color:#6b7280;cursor:pointer;transition:all .18s;white-space:nowrap;}
.filter-chip.active{background:#0c7bb3;border-color:#0c7bb3;color:#fff;}
.filter-chip:not(.active):hover{border-color:#0c7bb3;color:#0c7bb3;}
.chip-count{font-size:11px;font-weight:800;}
.conv-list{flex:1;overflow-y:auto;padding:4px 0;}
.conv-list::-webkit-scrollbar{width:4px;}
.conv-list::-webkit-scrollbar-thumb{background:#e0e7ef;border-radius:4px;}
.conv-item{display:flex;align-items:center;gap:11px;padding:11px 14px 11px 16px;cursor:pointer;transition:background .15s;position:relative;}
.conv-item:hover{background:#f5f6fa;}
.conv-item.active{background:#e8f4fb;border-left:3px solid #0c7bb3;}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;background:linear-gradient(135deg,#0c7bb3,#a75c9a);flex-shrink:0;}
.conv-info{flex:1;min-width:0;}
.conv-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;}
.conv-name{font-size:14px;font-weight:700;color:#1a2340;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv-time{font-size:11px;color:#9aaac4;flex-shrink:0;margin-left:4px;}
.conv-bottom{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.conv-preview{font-size:12.5px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.conv-preview.unread-preview{font-weight:700;color:#1a2340;}
.unread-badge{background:#0c7bb3;color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;flex-shrink:0;}
.no-results{text-align:center;padding:40px 20px;font-size:13px;color:#9aaac4;font-weight:600;}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#f5f6fa;overflow:hidden;}
.welcome-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px 24px;}
.welcome-text{text-align:center;}
.welcome-text h2{font-size:20px;font-weight:800;color:#1a2340;margin-bottom:6px;}
.welcome-text p{font-size:13.5px;color:#6b7280;line-height:1.55;}
.chat-screen{display:none;flex-direction:column;height:100%;overflow:hidden;}
.chat-screen.visible{display:flex;}

/* ── Topbar inside chat (clean) ── */
.chat-topbar{display:flex;align-items:center;gap:10px;padding:10px 18px;background:#fff;border-bottom:1.5px solid #e5e9f0;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.back-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:50%;color:#6b7280;display:flex;align-items:center;justify-content:center;transition:background .18s;}
.back-btn:hover{background:#f5f6fa;}
.back-btn svg{width:18px;height:18px;}
.topbar-info{flex:1;}
.topbar-name{font-size:15px;font-weight:800;color:#1a2340;}
.topbar-status{font-size:11px;color:#9aaac4;margin-top:2px;}
.status-dot{width:7px;height:7px;border-radius:50%;background:#16a34a;display:inline-block;margin-right:4px;}

/* ── Messages ── */
.messages-area{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:2px;}
.messages-area::-webkit-scrollbar{width:4px;}
.messages-area::-webkit-scrollbar-thumb{background:#e0e7ef;border-radius:4px;}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(4px);}to{opacity:1;transform:none;}}
.msg-row{display:flex;align-items:flex-end;gap:7px;margin-bottom:2px;}
.msg-row.sent{flex-direction:row-reverse;}
.recv-mini-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:800;background:linear-gradient(135deg,#0c7bb3,#a75c9a);flex-shrink:0;}
.recv-mini-avatar.spacer{visibility:hidden;}
.bubble{max-width:420px;padding:10px 14px;border-radius:18px;position:relative;word-break:break-word;}
.msg-row.sent .bubble{background:linear-gradient(135deg,#0c7bb3,#085d88);color:#fff;border-bottom-right-radius:5px;}
.msg-row.recv .bubble{background:#fff;color:#1a2340;border-bottom-left-radius:5px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.bubble-text{font-size:14px;line-height:1.5;display:block;}
.bubble-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:4px;}
.bubble-time{font-size:10.5px;opacity:.65;}
.msg-row.sent .bubble-time{color:#e0f0ff;}

/* ── Input ── */
.input-area{background:#fff;border-top:1.5px solid #e5e9f0;padding:10px 16px 12px;flex-shrink:0;}
.input-row{display:flex;align-items:flex-end;gap:8px;}
.msg-input{flex:1;border:1.5px solid #e5e9f0;border-radius:22px;padding:10px 16px;font-family:inherit;font-size:14px;color:#1a2340;background:#f5f6fa;outline:none;resize:none;max-height:120px;overflow-y:auto;transition:border-color .18s,background .18s;line-height:1.4;}
.msg-input:focus{border-color:#0c7bb3;background:#fff;box-shadow:0 0 0 3px rgba(12,123,179,.08);}
.msg-input::placeholder{color:#b0b8c1;}
.send-btn{width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,#0c7bb3,#085d88);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .18s,transform .18s;}
.send-btn:hover{opacity:.88;transform:scale(1.06);}
.send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.send-btn svg{width:18px;height:18px;}
.quick-actions{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;}
.qa-pill{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:16px;border:1.5px solid #e5e9f0;background:#fff;font-family:inherit;font-size:12px;font-weight:700;color:#6b7280;cursor:pointer;transition:all .18s;white-space:nowrap;}
.qa-pill:hover{border-color:#0c7bb3;color:#0c7bb3;background:#e8f4fb;}

/* ── Toast ── */
#toastContainer{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast-msg{background:#1a2340;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:toastIn .28s ease,toastOut .3s ease 2.5s forwards;}
@keyframes toastIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastOut{from{opacity:1;}to{opacity:0;}}

/* Responsive adjustments */
@media(max-width:900px){
  .header{padding:0 16px}
  .nav-link span{display:none}
  .nav-link{padding:6px 10px}
  .sidebar{width:280px}
}
@media(max-width:600px){
  .sidebar{width:260px}
  .chat-topbar{padding:8px 12px}
  .messages-area{padding:12px}
}
</style>
</head>
<body>

<!-- ⭐ Single unified header (identical to index.html style) -->
<header class="header">
  <div class="brand"><span class="brand-s">Stitch</span><span class="brand-i">ify</span></div>
  <nav class="header-nav">
    <a class="nav-link" href="/tailor"><i class="fas fa-home"></i><span>Home</span></a>
    <a class="nav-link" href="/tailor/orders"><i class="fas fa-box"></i><span>Orders</span></a>
    <a class="nav-link active" href="/tailor/chat"><i class="fas fa-comment-dots"></i><span>Chat</span></a>
    <a class="nav-link" href="/tailor/schedule"><i class="fas fa-calendar"></i><span>Schedule</span></a>
    <a class="nav-link" href="/tailor/profile"><i class="fas fa-user"></i><span>Profile</span></a>
  </nav>
</header>

<div class="app">
  <div class="chat-body">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-topbar"><span class="sidebar-title">Chats</span></div>
      <div class="sidebar-search">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input class="search-box" type="text" placeholder="Search conversations…" id="sidebarSearch"/>
        </div>
      </div>
      <div class="filter-row">
        <button class="filter-chip active" data-filter="all">All <span class="chip-count" id="countAll">0</span></button>
        <button class="filter-chip" data-filter="unread">Unread <span class="chip-count" id="countUnread">0</span></button>
      </div>
      <div class="conv-list" id="convList">
        <div class="no-results"><i class="fas fa-spinner fa-pulse"></i><br/>Loading…</div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main" id="main">
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-text">
          <h2>💬 Your Messages</h2>
          <p>Select a conversation to start chatting with a customer.</p>
        </div>
      </div>

      <div class="chat-screen" id="chatScreen">
        <div class="chat-topbar">
          <button class="back-btn" id="backBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          </button>
          <div class="topbar-info">
            <div class="topbar-name" id="topbarName">Customer Name</div>
            <div class="topbar-status"><span class="status-dot"></span>Active</div>
          </div>
        </div>

        <div class="messages-area" id="messagesArea">
          <div class="no-results">Select a conversation</div>
        </div>

        <div class="input-area">
          <div class="input-row">
            <textarea class="msg-input" id="msgInput" rows="1" placeholder="Type a message…" maxlength="1000"></textarea>
            <button class="send-btn" id="sendBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9l20-7z"/></svg>
            </button>
          </div>
          <div class="quick-actions">
            <button class="qa-pill" onclick="quickReply('order_update')">📦 Order Update</button>
            <button class="qa-pill" onclick="quickReply('ready_fitting')">📍 Ready for Fitting</button>
            <button class="qa-pill" onclick="quickReply('req_measurements')">📏 Request Measurements</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toastContainer"></div>

<script src="/shared/js/store.js"></script>
<script src="/shared/js/auth.js"></script>
<script src="/shared/js/events.js"></script>
<script src="/shared/js/api.js"></script>
<script src="/shared/js/data.js"></script>
<script src="/shared/js/navbar.js"></script>

<script>
// ── IMPORTANT: No extra brand/navbar injection — we already have static unified header.
// Just handle auth and chat logic.

// ── Auth ──
const token = localStorage.getItem('token');
const user  = JSON.parse(localStorage.getItem('user') || '{}');
if (!token || !user.id) { window.location.href = '/'; }

// ── State ──
let chats = [];
let currentChatId  = null;
let pollInterval   = null;
let chatRefreshInterval = null;
let currentFilter  = 'all';
let searchQuery    = '';
let isSending      = false;

const QUICK_REPLIES = {
  order_update:    "Your order is in progress. I'll keep you updated!",
  ready_fitting:   'Ready for fitting! Please come in at your convenience.',
  req_measurements:'Please share your measurements for accurate stitching.'
};

// ── Init ──
fetchChats();
chatRefreshInterval = setInterval(fetchChats, 8000);

// ──────────────────────────────────────
// FETCH CHAT LIST
// ──────────────────────────────────────
async function fetchChats() {
  try {
    const res = await fetch(`/api/tailor/chats/${user.id}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!res.ok) return;
    const data = await res.json();

    // Preserve locally-loaded messages
    chats = data.map(incoming => {
      const existing = chats.find(c => c._id === incoming._id);
      return existing ? { ...incoming, messages: existing.messages } : incoming;
    });

    renderChatList();
    updateFilterCounts();
  } catch (e) {
    console.error('fetchChats error:', e);
  }
}

// ──────────────────────────────────────
// RENDER CHAT LIST
// ──────────────────────────────────────
function getFilteredList() {
  let list = [...chats];
  if (currentFilter === 'unread') list = list.filter(c => c.unread_count > 0);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(c => (c.customer_name || '').toLowerCase().includes(q));
  }
  return list;
}

function renderChatList() {
  const container = document.getElementById('convList');
  const list = getFilteredList();
  if (!list.length) {
    container.innerHTML = '<div class="no-results">No conversations found</div>';
    return;
  }
  container.innerHTML = list.map(chat => {
    const isActive = currentChatId === chat._id;
    const hasUnread = chat.unread_count > 0;
    return `
      <div class="conv-item ${isActive ? 'active' : ''}" onclick="selectChat('${chat._id}')">
        <div class="avatar">${(chat.customer_name || 'C').substring(0,2).toUpperCase()}</div>
        <div class="conv-info">
          <div class="conv-top">
            <span class="conv-name">${escHtml(chat.customer_name)}</span>
            <span class="conv-time">${relTime(chat.last_message_time)}</span>
          </div>
          <div class="conv-bottom">
            <span class="conv-preview ${hasUnread ? 'unread-preview' : ''}">${escHtml(chat.last_message || 'No messages yet')}</span>
            ${hasUnread ? `<span class="unread-badge">${chat.unread_count}</span>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function updateFilterCounts() {
  document.getElementById('countAll').textContent    = chats.length;
  document.getElementById('countUnread').textContent = chats.filter(c => c.unread_count > 0).length;
}

// ──────────────────────────────────────
// SELECT CHAT
// ──────────────────────────────────────
async function selectChat(chatId) {
  if (currentChatId === chatId) return;
  currentChatId = chatId;
  renderChatList();

  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('chatScreen').classList.add('visible');

  const chat = chats.find(c => c._id === chatId);
  if (chat) {
    document.getElementById('topbarName').textContent = chat.customer_name || 'Customer';
  }

  await loadMessages();
  markRead();

  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(pollMessages, 3000);
}

// ──────────────────────────────────────
// LOAD MESSAGES
// ──────────────────────────────────────
async function loadMessages() {
  if (!currentChatId) return;
  try {
    const res = await fetch(`/api/chat/${currentChatId}/messages`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!res.ok) return;
    const messages = await res.json();
    const chat = chats.find(c => c._id === currentChatId);
    if (chat) {
      chat.messages = messages;
      renderMessages(chat);
      scrollToBottom();
    }
  } catch (e) {
    console.error('loadMessages error:', e);
  }
}

// ──────────────────────────────────────
// POLL FOR NEW MESSAGES
// ──────────────────────────────────────
async function pollMessages() {
  if (!currentChatId) return;
  try {
    const res = await fetch(`/api/chat/${currentChatId}/messages`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!res.ok) return;
    const messages = await res.json();
    const chat = chats.find(c => c._id === currentChatId);
    if (chat && messages.length !== (chat.messages || []).length) {
      chat.messages = messages;
      renderMessages(chat);
      markRead();
      scrollToBottom();
      fetchChats();
    }
  } catch (e) { /* silent */ }
}

// ──────────────────────────────────────
// RENDER MESSAGES
// ──────────────────────────────────────
function renderMessages(chat) {
  const container = document.getElementById('messagesArea');
  if (!container) return;
  const messages = chat.messages || [];

  if (!messages.length) {
    container.innerHTML = '<div style="text-align:center;color:#9aaac4;padding:40px;">No messages yet. Start the conversation!</div>';
    return;
  }

  let lastDir = null;
  container.innerHTML = messages.map((msg, i) => {
    const isSent = msg.sender_role === 'tailor';
    const dir = isSent ? 'sent' : 'recv';
    const showAvatar = !isSent && lastDir !== 'recv';
    lastDir = dir;
    return `
      <div class="msg-row ${dir}" style="animation:popIn .19s ease-out">
        ${dir === 'recv' ? `<div class="recv-mini-avatar ${showAvatar ? '' : 'spacer'}">${(chat.customer_name || 'C').substring(0,2).toUpperCase()}</div>` : ''}
        <div class="bubble">
          <span class="bubble-text">${escHtml(msg.message)}</span>
          <div class="bubble-meta">
            <span class="bubble-time">${formatMsgTime(msg.timestamp)}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ──────────────────────────────────────
// SEND MESSAGE
// ──────────────────────────────────────
async function sendMessage() {
  if (isSending) return;
  const input = document.getElementById('msgInput');
  const btn   = document.getElementById('sendBtn');
  const text  = input?.value.trim();
  if (!text || !currentChatId) return;

  isSending = true;
  if (btn) btn.disabled = true;

  const chat = chats.find(c => c._id === currentChatId);
  if (chat) {
    if (!chat.messages) chat.messages = [];
    chat.messages.push({
      message: text,
      sender_role: 'tailor',
      timestamp: new Date().toISOString(),
      optimistic: true
    });
    renderMessages(chat);
    scrollToBottom();
    input.value = '';
    input.style.height = 'auto';
  }

  try {
    const res = await fetch(`/api/chat/${currentChatId}/send-message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({
        sender: 'tailor',
        sender_name: user.name,
        message: text
      })
    });
    if (!res.ok) {
      showToast('Failed to send message');
      if (chat && chat.messages) {
        chat.messages = chat.messages.filter(m => !m.optimistic);
        renderMessages(chat);
      }
    } else {
      await loadMessages();
      fetchChats();
    }
  } catch (e) {
    showToast('Error sending message');
  } finally {
    isSending = false;
    if (btn) btn.disabled = false;
  }
}

function quickReply(type) {
  if (!currentChatId) { showToast('Select a conversation first'); return; }
  const input = document.getElementById('msgInput');
  if (input) { input.value = QUICK_REPLIES[type]; }
  sendMessage();
}

// ──────────────────────────────────────
// MARK READ
// ──────────────────────────────────────
async function markRead() {
  if (!currentChatId) return;
  try {
    await fetch(`/api/chat/${currentChatId}/read`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ user_id: user.id, role: 'tailor' })
    });
    const chat = chats.find(c => c._id === currentChatId);
    if (chat) { chat.unread_count = 0; updateFilterCounts(); renderChatList(); }
  } catch (e) { /* silent */ }
}

// ── HELPERS ──
function escHtml(text) {
  if (!text) return '';
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function relTime(ts) {
  if (!ts) return '';
  const diff = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (diff < 1)    return 'Just now';
  if (diff < 60)   return `${diff}m`;
  if (diff < 1440) return `${Math.floor(diff/60)}h`;
  if (diff < 2880) return 'Yesterday';
  return `${Math.floor(diff/1440)}d`;
}

function formatMsgTime(ts) {
  return ts ? new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
}

function scrollToBottom() {
  const el = document.getElementById('messagesArea');
  if (el) requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

function showToast(message) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast-msg';
  t.textContent = message;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ── Event listeners ──
document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('chatScreen').classList.remove('visible');
  document.getElementById('welcomeScreen').style.display = 'flex';
  currentChatId = null;
  if (pollInterval) clearInterval(pollInterval);
  renderChatList();
});

document.getElementById('sidebarSearch').addEventListener('input', function(e) {
  searchQuery = e.target.value;
  renderChatList();
});

document.querySelectorAll('.filter-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderChatList();
  });
});

document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('msgInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('msgInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Navbar search hook (if needed by shared navbar, but we have unified header)
window.onNavSearch = function(q) {
  if (document.getElementById('sidebarSearch')) {
    document.getElementById('sidebarSearch').value = q;
    searchQuery = q;
    renderChatList();
  }
};

// Cleanup
window.addEventListener('beforeunload', () => {
  if (pollInterval) clearInterval(pollInterval);
  if (chatRefreshInterval) clearInterval(chatRefreshInterval);
});
</script>
</body>
</html>
